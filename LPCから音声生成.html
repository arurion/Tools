<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ブラウザ版 LPC合成（ボコーダー）テスト</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f9f9f9;
    color: #333;
    padding: 20px;
    max-width: 650px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
  }
  input[type="range"], select, textarea {
    width: 100%;
    box-sizing: border-box;
    margin-top: 5px;
    padding: 8px;
  }
  button {
    margin-top: 25px;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background-color: #007BFF;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background-color: #0056b3; }
  .note { font-size: 0.85em; color: #666; font-weight: normal; }
  #msg { margin-top: 15px; font-weight: bold; text-align: center; }
</style>
</head>
<body>

<div class="card">
  <h2>LPC合成 カスタムテストツール</h2>
  <p>パルス波（人工声帯）にLPC係数（口の形）を通して、独自のロボットボイスを生成します。</p>
  
  <label>サンプリングレート (Hz):
    <div class="note">※ネットで拾った係数が「どのサンプリングレートで抽出されたか」に合わせてください。違うと声の質（口の大きさ）が変わります。</div>
    <select id="sampleRate">
      <option value="8000" selected>8000 Hz (昔の電話や軽い音声合成向け)</option>
      <option value="16000">16000 Hz</option>
      <option value="44100">44100 Hz</option>
    </select>
  </label>

  <label>声の高さ / ピッチ (Hz): <span id="pitchVal" style="color:#007BFF;">130</span> Hz
    <div class="note">※AquesTalkのピッチ変更と同じ仕組みです。数字が小さいと野太い声、大きいと高い声になります。</div>
    <input type="range" id="pitch" min="50" max="400" value="130" oninput="document.getElementById('pitchVal').innerText=this.value">
  </label>

  <label>LPC係数 a1, a2, ..., ap (カンマ区切り):
    <div class="note">※数式上の a0 (=1.0) は含めず、a1 からの数値を入力してください。</div>
    <!-- 初期値として、少し声っぽく共鳴する適当な係数を入れています -->
    <textarea id="lpcCoeffs" rows="5">-1.5, 1.2, -0.8, 0.5, -0.3, 0.2, -0.1</textarea>
  </label>
  
  <button id="playBtn">合成して音を鳴らす</button>
  <!-- 保存ボタンを追加（初期状態は無効にしておく） -->
  <button id="downloadBtn" style="background-color: #28a745; margin-top: 10px;" disabled>WAVとして保存</button>
  <p id="msg"></p>
</div>

<script>
  let audioCtx = null;

  document.getElementById('playBtn').addEventListener('click', () => {
    // Web Audio APIの初期化（ブラウザの制限上、ボタンクリック時に初期化が必要）
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    const sr = parseInt(document.getElementById('sampleRate').value);
    const pitch = parseFloat(document.getElementById('pitch').value);
    const coeffsStr = document.getElementById('lpcCoeffs').value;
    const msgEl = document.getElementById('msg');
    
    msgEl.innerText = "合成中...";
    msgEl.style.color = "#333";

    // 入力されたカンマ区切りの文字列を数値の配列に変換
    let a = coeffsStr.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
    if (a.length === 0) {
      msgEl.innerText = "❌ エラー: LPC係数を正しく入力してください。";
      msgEl.style.color = "red";
      return;
    }

    // 1秒分の音声データを格納するバッファを作成
    const duration = 1.0; 
    const length = Math.floor(sr * duration);
    const buffer = audioCtx.createBuffer(1, length, sr);
    const data = buffer.getChannelData(0);

    // ピッチからパルス波（声帯のブザー音）の間隔を計算
    const pulsePeriod = Math.floor(sr / pitch);

    let y = new Float32Array(length);
    let maxVal = 0;

// --- (ループの前に変数を追加) ---
    let prev_glottal = 0.0;

    // --- ここからLPC合成のコア計算 ---
    for (let i = 0; i < length; i++) {
      
      // 1. 純粋なパルス波（衝撃波）
      let pulse = (i % pulsePeriod === 0) ? 1.0 : 0.0;
      
      // 2. 【あなたのアイデア！】声帯波形のシミュレーション（ローパス）
      // パルスをそのまま使わず、0.9を使って高音を削り、滑らかな波にする
      let glottal_source = pulse + 0.9 * prev_glottal;
      prev_glottal = glottal_source;

      // ※音量が爆発しないように、全体のパワーを抑える（0.1を掛ける）
      let safe_source = glottal_source * 0.1;

      // 3. 口の形のシミュレーション（LPC）
      // パルスの代わりに、丸みを帯びた safe_source を口の中に流し込む
      let sum = 0;
      for (let j = 0; j < a.length; j++) {
        if (i - j - 1 >= 0) {
          sum += a[j] * y[i - j - 1];
        }
      }
      
      // 口から出てくる音
      y[i] = safe_source - sum;

      // (以下、発散チェックなどはそのまま)

      // 🚨 発散（ハウリング）チェック
      // LPC係数を適当にいじると、計算が無限大に爆発してしまうことがあります
      if (!isFinite(y[i]) || Math.abs(y[i]) > 100000) {
        msgEl.innerText = "❌ エラー: フィルタが発散しました（ハウリング状態）。係数が不安定です。";
        msgEl.style.color = "red";
        return;
      }

      // 正規化のために最大値を記録
      if (Math.abs(y[i]) > maxVal) {
        maxVal = Math.abs(y[i]);
      }
    }

    // 3. 音割れ防止（正規化）してバッファに書き込み
    if (maxVal > 0) {
      for (let i = 0; i < length; i++) {
        // 全体を最大値で割って、音量を0.8倍（安全マージン）に調整
        data[i] = (y[i] / maxVal) * 0.8; 
      }
    }
	// WAVフォーマットを作成する関数
function encodeWAV(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const writeString = (offset, string) => {
    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
  };

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // モノラル
  view.setUint16(22, 1, true); // 1チャンネル
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true); // 16bit
  writeString(36, 'data');
  view.setUint32(40, samples.length * 2, true);

  // Float32の音声を16bit PCMに変換
  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    let s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([view], { type: 'audio/wav' });
}
	const wavBlob = encodeWAV(data, sr); // dataは正規化した後のFloat32Array
const url = URL.createObjectURL(wavBlob);
const downloadBtn = document.getElementById('downloadBtn');

downloadBtn.disabled = false;
downloadBtn.onclick = () => {
  const a = document.createElement('a');
  a.href = url;
  a.download = "lpc_synth_voice.wav";
  a.click();
};
    // 4. ブラウザで再生
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);
    source.start();
    
    msgEl.innerText = "🎵 再生しました！";
    msgEl.style.color = "green";
  });
</script>
</body>
</html>
