<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Deflate Multi-Layer Generator</title>
    <style>
        :root {
            --bg-base: #EAF5FF;
            --glass-bg: rgba(234, 245, 255, 0.45);
            --glass-border: rgba(100, 116, 139, 0.15);
            --text-main: #1E293B;
            --text-sub: #64748B;
            --primary: #007ACC;
            --primary-hover: #00AEFF;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-base) 0%, #F1F7FF 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .app-window {
            display: flex;
            flex: 1;
            height: 100vh;
            position: relative;
        }

        @media (max-width: 900px) {
            .app-window {
                flex-direction: column;
                height: auto;
            }
        }

        aside {
            width: 380px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px) saturate(135%);
            border-right: 1px solid var(--glass-border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            flex-shrink: 0;
        }

        @media (max-width: 900px) {
            aside {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
            }
        }

        main {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.82rem;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-sub);
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row input[type="text"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.9rem;
            font-family: var(--font-mono);
            color: var(--text-main);
            outline: none;
        }

        .input-row select {
            width: 110px;
        }

        .input-help {
            font-size: 0.7rem;
            color: var(--text-sub);
            line-height: 1.3;
        }

        .slider-sync-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-sync-row input[type="range"] {
            flex: 1;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .slider-sync-row input[type="number"] {
            width: 70px;
            text-align: center;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            padding: 6px;
            font-size: 0.85rem;
            font-family: var(--font-mono);
            outline: none;
        }

        input[type="text"], select, input[type="number"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus, input[type="number"]:focus {
            border-color: var(--primary-hover);
        }

        .optimal-badge {
            font-size: 0.7rem;
            background: rgba(16, 185, 129, 0.12);
            color: #10B981;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: var(--font-mono);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .optimal-badge:hover {
            background: rgba(16, 185, 129, 0.25);
        }

        .prediction-badge {
            background: rgba(0, 122, 204, 0.05);
            border: 1px dashed var(--glass-border);
            border-radius: 4px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .prediction-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-sub);
        }

        .prediction-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            font-family: var(--font-mono);
        }

        .progress-box {
            background: rgba(100, 116, 139, 0.06);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            padding: 14px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fg {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-hover) 100%);
            transition: width 0.1s ease;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
        }

        .btn-generate {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #005F9E 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 3px;
            padding: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(0, 122, 204, 0.15);
            text-align: center;
            text-decoration: none;
            margin-top: auto;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 122, 204, 0.25);
            background: linear-gradient(135deg, var(--primary-hover) 0%, var(--primary) 100%);
        }

        .btn-generate:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(0, 122, 204, 0.1);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .table-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px) saturate(135%);
            border: 1px solid var(--glass-border);
            border-radius: 3px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.01);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            font-size: 0.85rem;
        }

        th {
            background: rgba(100, 116, 139, 0.05);
            color: var(--text-sub);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--glass-border);
        }

        tr {
            border-bottom: 1px solid rgba(100, 116, 139, 0.08);
            transition: background-color 0.2s;
        }

        tr:hover {
            background-color: rgba(100, 116, 139, 0.02);
        }

        tr:last-child {
            border-bottom: none;
        }

        .mono {
            font-family: var(--font-mono);
            letter-spacing: -0.02em;
        }

        .ratio-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            background: rgba(0, 122, 204, 0.1);
            color: var(--primary);
            font-weight: 600;
            font-size: 0.75rem;
        }

        .console-container {
            background: rgba(30, 41, 59, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 3px;
            padding: 16px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-sub);
            height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .console-line {
            display: flex;
            gap: 8px;
        }

        .console-tag {
            color: var(--primary);
            font-weight: 600;
        }

        .console-tag.err { color: #EF4444; }
        .console-tag.ok { color: #10B981; }
    </style>
</head>
<body>

    <!-- Web Worker 統合計算エンジン（予測・生成を共通化し、MTIME=0で完全一致させる） -->
    <script type="text/plain" id="predictionWorkerCode">
        const assert = (condition, msg = "Assertion failed") => {
            if (!condition) throw new Error(msg);
        };

        function b_str(n, size) {
            return n.toString(2).padStart(size, '0');
        }

        function b_str_rev(n, size) {
            let s = '';
            for (let i = 0; i < size; i++) s += ((n >>> i) & 1) ? '1' : '0';
            return s;
        }

        function pack_b(bit_string) {
            const len = bit_string.length;
            const byte_list = new Uint8Array(Math.ceil(len / 8));
            let byte_idx = 0;
            for (let i = 0; i < len; i += 8) {
                let val = 0;
                const limit = Math.min(i + 8, len);
                for (let j = i; j < limit; j++) {
                    if (bit_string.charCodeAt(j) === 49) val |= (1 << (j - i));
                }
                byte_list[byte_idx++] = val;
            }
            return byte_list;
        }

        const UNPACK_TABLE = Array.from({length: 256}, (_, b) => {
            let s = '';
            for (let j = 0; j < 8; j++) s += ((b >> j) & 1) ? '1' : '0';
            return s;
        });
        function unpack_b(data_bytes) {
            const len = data_bytes.length;
            const parts = new Array(len);
            for (let i = 0; i < len; i++) parts[i] = UNPACK_TABLE[data_bytes[i]];
            return parts.join('');
        }

        function pack32LE(n) {
            const buf = new ArrayBuffer(4);
            new DataView(buf).setUint32(0, Number(n), true);
            return new Uint8Array(buf);
        }

        function pack16LE(n) {
            const buf = new ArrayBuffer(2);
            new DataView(buf).setUint16(0, Number(n), true);
            return new Uint8Array(buf);
        }

        // 高速 GF(2)[x] CRC32（2^(2^k)キャッシュ + 256バイトテーブル）
        const POW2_CACHE = [2];
        function crcMul(a, b) {
            let res = 0;
            a = a >>> 0; b = b >>> 0;
            while (b !== 0) {
                if (b & 1) res = (res ^ a) >>> 0;
                b >>>= 1;
                a = (a & 0x80000000) ? (((a << 1) ^ 0x04C11DB7) >>> 0) : ((a << 1) >>> 0);
            }
            return res;
        }
        function crcPow2(exp) {
            exp = BigInt(exp);
            let res = 1;
            let k = 0;
            while (exp > 0n) {
                if (k >= POW2_CACHE.length) {
                    const prev = POW2_CACHE[POW2_CACHE.length - 1];
                    POW2_CACHE.push(crcMul(prev, prev));
                }
                if (exp & 1n) res = crcMul(res, POW2_CACHE[k]);
                exp >>= 1n;
                k++;
            }
            return res;
        }

        const BYTE_REV = new Uint8Array(256);
        const NORM_BYTE_TABLE = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
            let r = 0;
            for (let j = 0; j < 8; j++) if ((i >> j) & 1) r |= (1 << (7 - j));
            BYTE_REV[i] = r;
            let c = i << 24;
            for (let j = 0; j < 8; j++) c = (c & 0x80000000) ? (((c << 1) ^ 0x04C11DB7) >>> 0) : ((c << 1) >>> 0);
            NORM_BYTE_TABLE[i] = c >>> 0;
        }

        class CRC32 {
            constructor() { this.crc = 0; this.size = 0n; }
            normalize_bits(bits) {
                let ret = 0;
                for (let i = 0; i < bits.length; i++) {
                    const bit = bits.charCodeAt(i) === 49 ? 1 : 0;
                    ret = (((ret << 1) ^ ((ret >>> 31) ? 0x04C11DB7 : 0)) ^ bit) >>> 0;
                }
                return ret;
            }
            normalize_bytes(bytes) {
                let ret = 0;
                for (let i = 0; i < bytes.length; i++) {
                    ret = (((ret << 8) | BYTE_REV[bytes[i]]) ^ NORM_BYTE_TABLE[ret >>> 24]) >>> 0;
                }
                return ret;
            }
            concat(a, b, b_size) { return (crcMul(a, crcPow2(b_size)) ^ b) >>> 0; }
            repeat(a, size, times) {
                let ret = 0;
                let exp_size = crcPow2(BigInt(size));
                let exp_ret_size = 1;
                a = a >>> 0; times = BigInt(times);
                while (times > 0n) {
                    if (times & 1n) {
                        ret = (crcMul(a, exp_ret_size) ^ ret) >>> 0;
                        exp_ret_size = crcMul(exp_ret_size, exp_size);
                    }
                    a = (crcMul(a, exp_size) ^ a) >>> 0;
                    exp_size = crcMul(exp_size, exp_size);
                    times >>= 1n;
                }
                return [ret, exp_ret_size];
            }
            push(bits) {
                this.crc = this.concat(this.crc, this.normalize_bits(bits), BigInt(bits.length));
                this.size += BigInt(bits.length);
            }
            push_bytes(bytes) {
                let c = this.crc;
                for (let i = 0; i < bytes.length; i++) {
                    c = (((c << 8) | BYTE_REV[bytes[i]]) ^ NORM_BYTE_TABLE[c >>> 24]) >>> 0;
                }
                this.crc = c;
                this.size += BigInt(bytes.length) * 8n;
            }
            push_repeat(bits, times) {
                times = BigInt(times);
                if (times === 0n || !bits) return;
                const [rep_crc, exp_total] = this.repeat(this.normalize_bits(bits), bits.length, times);
                this.crc = (crcMul(this.crc, exp_total) ^ rep_crc) >>> 0;
                this.size += BigInt(bits.length) * times;
            }
            push_repeat_bytes(bytes, times) {
                times = BigInt(times);
                if (times === 0n || bytes.length === 0) return;
                const [rep_crc, exp_total] = this.repeat(this.normalize_bytes(bytes), bytes.length * 8, times);
                this.crc = (crcMul(this.crc, exp_total) ^ rep_crc) >>> 0;
                this.size += BigInt(bytes.length) * 8n * times;
            }
            to_crc32() {
                const rem = (-this.size) % 8n;
                const pos_rem = rem < 0n ? rem + 8n : rem;
                const size = pos_rem === 0n ? this.size : (this.size / 8n * 8n + 8n);
                const concatted = pos_rem === 0n ? this.crc : crcMul(this.crc, crcPow2(pos_rem));
                const ret = (crcMul(concatted, crcPow2(32n)) ^ crcMul(0xFFFFFFFF, crcPow2(size))) >>> 0;
                const val = (ret ^ 0xFFFFFFFF) >>> 0;
                let rev = 0;
                for (let i = 0; i < 32; i++) rev = (rev << 1) | ((val >>> i) & 1);
                return rev >>> 0;
            }
        }

        function gcd(a, b) {
            a = BigInt(a); b = BigInt(b);
            while (b !== 0n) { const t = b; b = a % b; a = t; }
            return a;
        }

        // O(N) チャンク蓄積型 BitStream
        class BitStream {
            constructor(header_bytes = null) {
                this.tokens = [];
                this.crc = new CRC32();
                this.register = '';
                if (header_bytes && header_bytes.length > 0) this.push_bytes(header_bytes);
            }
            _append_bytes_to_single(data) {
                if (data.length === 0) return;
                const last = this.tokens[this.tokens.length - 1];
                if (last && last.times === 1n) {
                    if (!last.chunks) last.chunks = [last.data];
                    last.chunks.push(data);
                    last.totalLen = (last.totalLen ?? last.data.length) + data.length;
                    last.data = null;
                } else {
                    this.tokens.push({ chunks: [data], data: null, totalLen: data.length, times: 1n });
                }
            }
            push(bits) {
                if (!bits) return;
                this.crc.push(bits);
                this.push_once(bits);
            }
            push_bytes(bytes) {
                if (bytes.length === 0) return;
                if (this.register.length === 0) {
                    this.crc.push_bytes(bytes);
                    this._append_bytes_to_single(bytes);
                } else {
                    this.push(unpack_b(bytes));
                }
            }
            push_once(bits) {
                if (!bits) return;
                this.register += bits;
                if (this.register.length >= 8) {
                    const bytes_count = this.register.length >> 3;
                    const data = pack_b(this.register.slice(0, 8 * bytes_count));
                    this._append_bytes_to_single(data);
                    this.register = this.register.slice(8 * bytes_count);
                }
            }
            push_repeat(bits, times) {
                times = BigInt(times);
                if (times === 0n || !bits) return;
                this.crc.push_repeat(bits, times);
                let lead = '';
                while (this.register.length !== 0) {
                    const push_bits_len = Math.min(8 - this.register.length, bits.length);
                    this.push_once(bits.slice(0, push_bits_len));
                    lead = bits.slice(push_bits_len);
                    times--;
                    if (times === 0n) { this.push_once(lead); return; }
                }
                const bit_len = BigInt(bits.length);
                const lcm_val = (bit_len * 8n) / gcd(bit_len, 8n);
                const cycle_size = lcm_val / bit_len;
                const cycle_times = times / cycle_size;
                const cycle_remainder = times % cycle_size;
                if (cycle_times > 0n) {
                    const cycle_data_bits = (lead + bits.repeat(Number(cycle_size))).slice(0, Number(bit_len * cycle_size));
                    const packed = pack_b(cycle_data_bits);
                    if (cycle_times === 1n) {
                        this._append_bytes_to_single(packed);
                    } else {
                        this.tokens.push({ data: packed, times: cycle_times });
                    }
                }
                this.push_once(lead + bits.repeat(Number(cycle_remainder)));
            }
            align() {
                if (this.register.length % 8 !== 0) {
                    this.push('0'.repeat(8 - (this.register.length % 8)));
                }
            }
            finalize_tokens() {
                const res = [];
                for (const tok of this.tokens) {
                    let data = tok.data;
                    if (!data && tok.chunks) {
                        if (tok.chunks.length === 1) {
                            data = tok.chunks[0];
                        } else {
                            data = new Uint8Array(tok.totalLen);
                            let off = 0;
                            for (const c of tok.chunks) { data.set(c, off); off += c.length; }
                        }
                    }
                    if (data && data.length > 0) {
                        if (res.length > 0 && tok.times === 1n && res[res.length - 1].times === 1n) {
                            const prev = res[res.length - 1].data;
                            const merged = new Uint8Array(prev.length + data.length);
                            merged.set(prev); merged.set(data, prev.length);
                            res[res.length - 1].data = merged;
                        } else {
                            res.push({ data, times: tok.times });
                        }
                    }
                }
                if (this.register.length > 0) {
                    const tail = pack_b(this.register.padEnd(8, '0'));
                    if (res.length > 0 && res[res.length - 1].times === 1n) {
                        const prev = res[res.length - 1].data;
                        const merged = new Uint8Array(prev.length + tail.length);
                        merged.set(prev); merged.set(tail, prev.length);
                        res[res.length - 1].data = merged;
                    } else {
                        res.push({ data: tail, times: 1n });
                    }
                    this.register = '';
                }
                this.tokens = res;
                return res;
            }
            total_bytes() {
                let total = 0n;
                for (const tok of this.tokens) {
                    const len = tok.data ? BigInt(tok.data.length) : BigInt(tok.totalLen);
                    total += len * tok.times;
                }
                if (this.register.length > 0) total += BigInt(Math.ceil(this.register.length / 8));
                return total;
            }
            to_bytes(maxBytes = 512 * 1024 * 1024) {
                const totalBI = this.total_bytes();
                if (totalBI > BigInt(maxBytes)) {
                    throw new Error(`出力サイズがブラウザ安全上限 (${Math.floor(maxBytes / (1024 * 1024))} MiB) を超えています: ${totalBI} B（レイヤー数を増やしてください）`);
                }
                const tokens = this.finalize_tokens();
                const res = new Uint8Array(Number(totalBI));
                let offset = 0;
                for (const tok of tokens) {
                    const t = Number(tok.times);
                    const single = tok.data;
                    for (let i = 0; i < t; i++) {
                        res.set(single, offset);
                        offset += single.length;
                    }
                }
                return res;
            }
            get_crc() { return this.crc.to_crc32(); }
        }

        // RFC 1951 長さ・距離ルックアップテーブル
        const LEN_LUT = new Array(259);
        for (let n = 3; n <= 258; n++) {
            if (n === 258) LEN_LUT[n] = [285, ''];
            else if (n < 11) LEN_LUT[n] = [257 + n - 3, ''];
            else if (n < 19) LEN_LUT[n] = [265 + ((n - 11) >> 1), b_str_rev((n - 11) & 1, 1)];
            else if (n < 35) LEN_LUT[n] = [269 + ((n - 19) >> 2), b_str_rev((n - 19) & 3, 2)];
            else if (n < 67) LEN_LUT[n] = [273 + ((n - 35) >> 3), b_str_rev((n - 35) & 7, 3)];
            else if (n < 131) LEN_LUT[n] = [277 + ((n - 67) >> 4), b_str_rev((n - 67) & 15, 4)];
            else LEN_LUT[n] = [281 + ((n - 131) >> 5), b_str_rev((n - 131) & 31, 5)];
        }
        function get_len_literal(n) {
            assert(3 <= n && n <= 258, "Invalid length: " + n);
            return LEN_LUT[n];
        }
        function get_dist_literal(n) {
            assert(1 <= n && n <= 32768, "Invalid distance: " + n);
            if (n <= 4) return [n - 1, ''];
            const m = n - 1;
            const msb = 31 - Math.clz32(m);
            const ebits = msb - 1;
            const sym = (ebits << 1) + 2 + ((m >>> ebits) & 1);
            const extra = m & ((1 << ebits) - 1);
            return [sym, b_str_rev(extra, ebits)];
        }

        // ハッシュチェーン型 LZSS（dist >= 1 のオーバーラップ RLE も検出）
        function lzss_compress(data_bytes) {
            const n = data_bytes.length;
            const compressed = [];
            if (n === 0) return compressed;
            const head = new Int32Array(65536).fill(-1);
            const prev = new Int32Array(n).fill(-1);
            let i = 0;
            while (i < n) {
                let best_len = 0;
                let best_dist = 0;
                if (i + 2 < n) {
                    const h = ((data_bytes[i] << 10) ^ (data_bytes[i + 1] << 5) ^ data_bytes[i + 2]) & 0xFFFF;
                    let pos = head[h];
                    let chain = 64;
                    const max_l = Math.min(258, n - i);
                    while (pos !== -1 && (i - pos) <= 32768 && chain-- > 0) {
                        if (data_bytes[pos] === data_bytes[i] &&
                            data_bytes[pos + 1] === data_bytes[i + 1] &&
                            data_bytes[pos + 2] === data_bytes[i + 2]) {
                            if (best_len < 3 || data_bytes[pos + best_len] === data_bytes[i + best_len]) {
                                let l = 3;
                                while (l < max_l && data_bytes[pos + l] === data_bytes[i + l]) l++;
                                if (l > best_len) {
                                    best_len = l;
                                    best_dist = i - pos;
                                    if (best_len === max_l) break;
                                }
                            }
                        }
                        pos = prev[pos];
                    }
                    prev[i] = head[h];
                    head[h] = i;
                }
                if (best_len >= 3) {
                    compressed.push({ type: "copy", len: best_len, dist: best_dist });
                    const end = Math.min(i + best_len, n - 2);
                    for (let j = i + 1; j < end; j++) {
                        const h2 = ((data_bytes[j] << 10) ^ (data_bytes[j + 1] << 5) ^ data_bytes[j + 2]) & 0xFFFF;
                        prev[j] = head[h2];
                        head[h2] = j;
                    }
                    i += best_len;
                } else {
                    compressed.push({ type: "value", value: data_bytes[i] });
                    i++;
                }
            }
            return compressed;
        }

        // Package-Merge 法による最適長さ制限ハフマン符号化（BigInt重み完全対応）
        function huffman_encoding(char_count, max_size) {
            const items = [];
            for (const k in char_count) {
                const w = BigInt(char_count[k]);
                if (w > 0n) items.push({ sym: Number(k), w });
            }
            if (items.length === 0) return {};
            if (items.length === 1) {
                const sym = items[0].sym;
                return { [sym]: 1, [sym === 0 ? 1 : 0]: 1 };
            }
            items.sort((a, b) => (a.w < b.w ? -1 : a.w > b.w ? 1 : a.sym - b.sym));
            const n = items.length;
            const leaves = items.map((it, idx) => ({ w: it.w, idxs: [idx] }));
            let current = leaves.slice();
            for (let d = 0; d < max_size - 1; d++) {
                current.sort((a, b) => (a.w < b.w ? -1 : a.w > b.w ? 1 : 0));
                const packages = [];
                for (let j = 0; j + 1 < current.length; j += 2) {
                    packages.push({
                        w: current[j].w + current[j + 1].w,
                        idxs: current[j].idxs.concat(current[j + 1].idxs)
                    });
                }
                current = packages.concat(leaves);
            }
            current.sort((a, b) => (a.w < b.w ? -1 : a.w > b.w ? 1 : 0));
            const lengths = new Array(n).fill(0);
            const limit = 2 * n - 2;
            for (let i = 0; i < limit; i++) {
                for (const idx of current[i].idxs) lengths[idx]++;
            }
            const res = {};
            for (let i = 0; i < n; i++) res[items[i].sym] = lengths[i];
            return res;
        }

        function generate_encoding(table) {
            const sorted_items = Object.entries(table)
                .map(([k, v]) => [Number(k), v])
                .filter(([, v]) => v > 0)
                .sort((a, b) => (a[1] !== b[1] ? a[1] - b[1] : a[0] - b[0]));
            let prev_value = 0;
            let prev_width = 0;
            const res = {};
            for (let i = 0; i < sorted_items.length; i++) {
                const [k, v] = sorted_items[i];
                if (i !== 0) {
                    prev_value += 1;
                    prev_value <<= (v - prev_width);
                }
                prev_width = v;
                res[k] = b_str(prev_value, v);
            }
            return res;
        }

        function encode_len_table(lst) {
            const encoded = [];
            let i = 0;
            const n = lst.length;
            while (i < n) {
                const val = lst[i];
                assert(val <= 15);
                let j = i + 1;
                while (j < n && lst[j] === val) j++;
                let c = j - i;
                i = j;
                if (val === 0) {
                    while (c > 0) {
                        if (c <= 2) {
                            for (let k = 0; k < c; k++) encoded.push(0);
                            c = 0;
                        } else if (c <= 10) {
                            encoded.push(17, b_str_rev(c - 3, 3));
                            c = 0;
                        } else {
                            const take = Math.min(c, 138);
                            encoded.push(18, b_str_rev(take - 11, 7));
                            c -= take;
                        }
                    }
                } else {
                    encoded.push(val);
                    c--;
                    while (c > 0) {
                        if (c < 3) {
                            for (let k = 0; k < c; k++) encoded.push(val);
                            c = 0;
                        } else {
                            const take = (c === 7 || c === 8) ? (c - 3) : Math.min(c, 6);
                            encoded.push(16, b_str_rev(take - 3, 2));
                            c -= take;
                        }
                    }
                }
            }
            return encoded;
        }

        function get_huffman_block(lit_table, dist_table) {
            const lit_size = Math.max(...Object.keys(lit_table).map(Number).concat([256])) + 1;
            const dist_size = Math.max(...Object.keys(dist_table).map(Number).concat([0])) + 1;
            const lit_list = Array.from({length: lit_size}, (_, i) => lit_table[i] || 0);
            const dist_list = Array.from({length: dist_size}, (_, i) => dist_table[i] || 0);

            const lit_encoded = encode_len_table(lit_list);
            const dist_encoded = encode_len_table(dist_list);
            const all_encoded = lit_encoded.concat(dist_encoded);

            const tally = {};
            for (const val of all_encoded) {
                if (typeof val === 'number') tally[val] = (tally[val] || 0n) + 1n;
            }

            const encoding_huffman = huffman_encoding(tally, 7);
            const encoding_table = generate_encoding(encoding_huffman);

            const lit_data = lit_encoded.map(val => typeof val === 'number' ? encoding_table[val] : val).join('');
            const dist_data = dist_encoded.map(val => typeof val === 'number' ? encoding_table[val] : val).join('');

            const order = [16, 17, 18, 0, 8, 7, 9, 6, 10, 5, 11, 4, 12, 3, 13, 2, 14, 1, 15];
            const encoding_list = order.map(val => encoding_huffman[val] || 0);
            let r_idx = -1;
            for (let idx = encoding_list.length - 1; idx >= 0; idx--) {
                if (encoding_list[idx] !== 0) { r_idx = idx; break; }
            }
            const end_idx = Math.max(r_idx, 3);
            const final_encoding_list = encoding_list.slice(0, end_idx + 1);

            return [
                b_str_rev(lit_size - 257, 5),
                b_str_rev(dist_size - 1, 5),
                b_str_rev(final_encoding_list.length - 4, 4),
                final_encoding_list.map(v => b_str_rev(v, 3)).join(''),
                lit_data,
                dist_data
            ].join('');
        }

        const FIXED_LT = (() => {
            const lengths = {};
            for (let s = 0; s <= 143; s++) lengths[s] = 8;
            for (let s = 144; s <= 255; s++) lengths[s] = 9;
            for (let s = 256; s <= 279; s++) lengths[s] = 7;
            for (let s = 280; s <= 287; s++) lengths[s] = 8;
            return generate_encoding(lengths);
        })();
        const FIXED_DT = Array.from({length: 30}, (_, d) => b_str(d, 5));

        function encode_group_dynamic(group_tokens, is_final) {
            const lit_count = {};
            const dist_count = {};
            const addLit = (k, v) => { lit_count[k] = (lit_count[k] || 0n) + v; };
            const addDist = (k, v) => { dist_count[k] = (dist_count[k] || 0n) + v; };

            const cached = [];
            for (const token of group_tokens) {
                const lzss_res = lzss_compress(token.data);
                cached.push({ token, lzss_res });
                const dlen = token.data.length;

                const data_lit_count = {};
                const data_dist_count = {};
                for (const datum of lzss_res) {
                    if (datum.type === "value") {
                        data_lit_count[datum.value] = (data_lit_count[datum.value] || 0n) + 1n;
                    } else {
                        const [ll] = get_len_literal(datum.len);
                        const [dl] = get_dist_literal(datum.dist);
                        data_lit_count[ll] = (data_lit_count[ll] || 0n) + 1n;
                        data_dist_count[dl] = (data_dist_count[dl] || 0n) + 1n;
                    }
                }

                if (dlen <= 258 && token.times > 1n) {
                    const per_chunk = Math.floor(258 / dlen);
                    const per_chunk_bi = BigInt(per_chunk);
                    const match_len = dlen * per_chunk;
                    const reps = (token.times - 1n) / per_chunk_bi;
                    const rem_t = (token.times - 1n) % per_chunk_bi;

                    for (const k in data_lit_count) addLit(k, data_lit_count[k]);
                    for (const k in data_dist_count) addDist(k, data_dist_count[k]);

                    if (reps > 0n) {
                        const [ll] = get_len_literal(match_len);
                        const [dl] = get_dist_literal(dlen);
                        addLit(ll, reps);
                        addDist(dl, reps);
                    }
                    const rem_bytes = dlen * Number(rem_t);
                    if (rem_bytes > 0) {
                        if (rem_bytes < 3) {
                            for (const k in data_lit_count) addLit(k, data_lit_count[k] * rem_t);
                            for (const k in data_dist_count) addDist(k, data_dist_count[k] * rem_t);
                        } else {
                            const [rl] = get_len_literal(rem_bytes);
                            const [rd] = get_dist_literal(dlen);
                            addLit(rl, 1n);
                            addDist(rd, 1n);
                        }
                    }
                } else if (dlen > 258 && dlen <= 32768 && token.times > 1n) {
                    for (const k in data_lit_count) addLit(k, data_lit_count[k]);
                    for (const k in data_dist_count) addDist(k, data_dist_count[k]);
                    const rem_times = token.times - 1n;
                    for (let s = 0; s < dlen; s += 258) {
                        const slen = Math.min(258, dlen - s);
                        if (slen < 3) {
                            for (let j = s; j < s + slen; j++) addLit(token.data[j], rem_times);
                        } else {
                            const [sl] = get_len_literal(slen);
                            const [sd] = get_dist_literal(dlen);
                            addLit(sl, rem_times);
                            addDist(sd, rem_times);
                        }
                    }
                } else {
                    for (const k in data_lit_count) addLit(k, data_lit_count[k] * token.times);
                    for (const k in data_dist_count) addDist(k, data_dist_count[k] * token.times);
                }
            }
            addLit(0x100, 1n);

            const lit_huffman = huffman_encoding(lit_count, 15);
            const hasDist = Object.keys(dist_count).length > 0;
            const dist_huffman = hasDist ? huffman_encoding(dist_count, 15) : { 0: 0 };
            const lit_table = generate_encoding(lit_huffman);
            const dist_table = hasDist ? generate_encoding(dist_huffman) : {};

            const headerBits = (is_final ? '1' : '0') + '01' + get_huffman_block(lit_huffman, dist_huffman);
            const ops = [{ type: 'push', bits: headerBits }];
            let totalBits = BigInt(headerBits.length);

            for (const { token, lzss_res } of cached) {
                const parts = [];
                for (const datum of lzss_res) {
                    if (datum.type === "value") {
                        parts.push(lit_table[datum.value]);
                    } else {
                        const [ll, lb] = get_len_literal(datum.len);
                        const [dl, db] = get_dist_literal(datum.dist);
                        parts.push(lit_table[ll] + lb + dist_table[dl] + db);
                    }
                }
                const data_huffman = parts.join('');
                const dlen = token.data.length;

                if (dlen <= 258 && token.times > 1n) {
                    const per_chunk = Math.floor(258 / dlen);
                    const per_chunk_bi = BigInt(per_chunk);
                    const match_len = dlen * per_chunk;
                    const reps = (token.times - 1n) / per_chunk_bi;
                    const rem_t = (token.times - 1n) % per_chunk_bi;

                    ops.push({ type: 'push', bits: data_huffman });
                    totalBits += BigInt(data_huffman.length);

                    if (reps > 0n) {
                        const [ll, lb] = get_len_literal(match_len);
                        const [dl, db] = get_dist_literal(dlen);
                        const rep = lit_table[ll] + lb + dist_table[dl] + db;
                        ops.push({ type: 'repeat', bits: rep, times: reps });
                        totalBits += BigInt(rep.length) * reps;
                    }
                    const rem_bytes = dlen * Number(rem_t);
                    if (rem_bytes > 0) {
                        if (rem_bytes < 3) {
                            ops.push({ type: 'repeat', bits: data_huffman, times: rem_t });
                            totalBits += BigInt(data_huffman.length) * rem_t;
                        } else {
                            const [rl, rlb] = get_len_literal(rem_bytes);
                            const [rd, rdb] = get_dist_literal(dlen);
                            const remBits = lit_table[rl] + rlb + dist_table[rd] + rdb;
                            ops.push({ type: 'push', bits: remBits });
                            totalBits += BigInt(remBits.length);
                        }
                    }
                } else if (dlen > 258 && dlen <= 32768 && token.times > 1n) {
                    ops.push({ type: 'push', bits: data_huffman });
                    totalBits += BigInt(data_huffman.length);
                    const rep_parts = [];
                    for (let s = 0; s < dlen; s += 258) {
                        const slen = Math.min(258, dlen - s);
                        if (slen < 3) {
                            for (let j = s; j < s + slen; j++) rep_parts.push(lit_table[token.data[j]]);
                        } else {
                            const [sl, slb] = get_len_literal(slen);
                            const [sd, sdb] = get_dist_literal(dlen);
                            rep_parts.push(lit_table[sl] + slb + dist_table[sd] + sdb);
                        }
                    }
                    const rep = rep_parts.join('');
                    const rem_times = token.times - 1n;
                    ops.push({ type: 'repeat', bits: rep, times: rem_times });
                    totalBits += BigInt(rep.length) * rem_times;
                } else {
                    if (token.times === 1n) {
                        ops.push({ type: 'push', bits: data_huffman });
                        totalBits += BigInt(data_huffman.length);
                    } else {
                        ops.push({ type: 'repeat', bits: data_huffman, times: token.times });
                        totalBits += BigInt(data_huffman.length) * token.times;
                    }
                }
            }
            const eob = lit_table[0x100];
            ops.push({ type: 'push', bits: eob });
            totalBits += BigInt(eob.length);
            return { ops, totalBits };
        }

        // ブロック毎に Dynamic / Stored / Fixed の最小ビット長を選択
        function encode_group_best(group_tokens, is_final, cur_bit_offset) {
            const dyn = encode_group_dynamic(group_tokens, is_final);
            let totalRaw = 0n;
            for (const t of group_tokens) totalRaw += BigInt(t.data.length) * t.times;
            if (totalRaw > 65535n) return dyn.ops;

            const rawLen = Number(totalRaw);
            const raw = new Uint8Array(rawLen);
            let off = 0;
            for (const t of group_tokens) {
                const times = Number(t.times);
                for (let i = 0; i < times; i++) {
                    raw.set(t.data, off);
                    off += t.data.length;
                }
            }

            let bestOps = dyn.ops;
            let bestBits = dyn.totalBits;

            const pad = (8 - ((cur_bit_offset + 3) % 8)) % 8;
            const storedBits = BigInt(3 + pad + 32 + 8 * rawLen);
            if (storedBits < bestBits) {
                const hdr = (is_final ? '1' : '0') + '00' + '0'.repeat(pad);
                const lenBits = unpack_b(pack16LE(rawLen)) + unpack_b(pack16LE((~rawLen) & 0xFFFF));
                bestOps = [
                    { type: 'push', bits: hdr + lenBits },
                    { type: 'push_bytes', bytes: raw }
                ];
                bestBits = storedBits;
            }

            const lz = lzss_compress(raw);
            const fparts = [(is_final ? '1' : '0') + '10'];
            for (const datum of lz) {
                if (datum.type === "value") {
                    fparts.push(FIXED_LT[datum.value]);
                } else {
                    const [ll, lb] = get_len_literal(datum.len);
                    const [dl, db] = get_dist_literal(datum.dist);
                    fparts.push(FIXED_LT[ll] + lb + FIXED_DT[dl] + db);
                }
            }
            fparts.push(FIXED_LT[0x100]);
            const fixedStr = fparts.join('');
            if (BigInt(fixedStr.length) < bestBits) {
                bestOps = [{ type: 'push', bits: fixedStr }];
            }
            return bestOps;
        }

        function computeLayerFilename(base, count, mode) {
            if (count === 0) return base.replace(/~l/g, '0');
            if (base.includes('~l')) return base.replace(/~l/g, count);
            if (mode === 'uniform') return base.endsWith('.gz') ? base : `${base}.gz`;
            if (mode === 'layer_num') return `${base}~l.gz`.replace(/~l/g, count);
            return base + ".gz".repeat(count);
        }

        let cachedKey = null;
        let cachedStream = null;
        let cachedFinalSize = null;

        self.onmessage = function(e) {
            try {
                const { action, target_size_setting_str, count_layers, filename, naming_mode, max_download_bytes } = e.data;
                const reqKey = JSON.stringify([target_size_setting_str, count_layers, filename, naming_mode]);

                if (action === 'generate' && cachedKey === reqKey && cachedStream) {
                    const bytes = cachedStream.to_bytes(max_download_bytes);
                    self.postMessage({
                        type: 'generation_complete',
                        finalSize: cachedFinalSize.toString(),
                        buffer: bytes.buffer
                    }, [bytes.buffer]);
                    return;
                }

                const target_size_setting = BigInt(target_size_setting_str);
                const layers = Number(count_layers);
                const te = new TextEncoder();

                let tokens = [{ data: new Uint8Array([65]), times: target_size_setting }];
                const initial_crc = new CRC32();
                initial_crc.push_repeat_bytes(tokens[0].data, target_size_setting);
                let data_crc = initial_crc.to_crc32();

                let stream = null;
                let current_uncompressed = target_size_setting;

                for (let count = 0; count < layers; count++) {
                    const data_size = current_uncompressed;

                    const fnStr = computeLayerFilename(filename, count, naming_mode);
                    const fnBytes = fnStr.length > 0 ? te.encode(fnStr + "\0") : null;
                    const header = new Uint8Array(10);
                    header[0] = 31; header[1] = 139; header[2] = 8;
                    header[3] = fnBytes ? 0x08 : 0x00;
                    header[9] = 3;

                    let fullHeader = header;
                    if (fnBytes) {
                        fullHeader = new Uint8Array(10 + fnBytes.length);
                        fullHeader.set(header);
                        fullHeader.set(fnBytes, 10);
                    }

                    stream = new BitStream(fullHeader);

                    // 巨大繰り返しトークンを独立ブロックに分離してハフマン符号圧迫を防ぐ
                    const groups = [];
                    let curSmall = [];
                    for (const tok of tokens) {
                        if (tok.times >= 100n && tok.data.length <= 258) {
                            if (curSmall.length > 0) { groups.push(curSmall); curSmall = []; }
                            groups.push([tok]);
                        } else {
                            curSmall.push(tok);
                        }
                    }
                    if (curSmall.length > 0) groups.push(curSmall);

                    for (let gi = 0; gi < groups.length; gi++) {
                        const ops = encode_group_best(groups[gi], gi === groups.length - 1, stream.register.length);
                        for (const op of ops) {
                            if (op.type === 'push') stream.push(op.bits);
                            else if (op.type === 'push_bytes') stream.push_bytes(op.bytes);
                            else stream.push_repeat(op.bits, op.times);
                        }
                    }

                    stream.align();
                    stream.push_bytes(pack32LE(data_crc));
                    stream.push_bytes(pack32LE(data_size & 0xFFFFFFFFn));

                    tokens = stream.finalize_tokens();
                    const compressed_size = stream.total_bytes();

                    self.postMessage({
                        type: 'layer_progress',
                        data: {
                            layer: count + 1,
                            totalLayers: layers,
                            uncompressed: current_uncompressed.toString(),
                            compressed: compressed_size.toString(),
                            crc: "0x" + data_crc.toString(16).toUpperCase().padStart(8, '0')
                        }
                    });

                    current_uncompressed = compressed_size;
                    data_crc = stream.get_crc();
                }

                cachedKey = reqKey;
                cachedStream = stream;
                cachedFinalSize = current_uncompressed;

                if (action === 'generate') {
                    const bytes = stream.to_bytes(max_download_bytes);
                    self.postMessage({
                        type: 'generation_complete',
                        finalSize: current_uncompressed.toString(),
                        buffer: bytes.buffer
                    }, [bytes.buffer]);
                } else {
                    self.postMessage({
                        type: 'prediction_complete',
                        finalSize: current_uncompressed.toString()
                    });
                }
            } catch (err) {
                self.postMessage({
                    type: 'worker_error',
                    message: err && err.message ? err.message : String(err)
                });
            }
        };
    </script>

    <div class="app-window">
        <aside>
            <div>
                <h1>Symbolic Deflate</h1>
                <div class="subtitle">メモリ効率特化型、超巨大多重圧縮ジェネレーター</div>
            </div>

            <div class="control-group">
                <label>目標展開サイズ (TARGET_SIZE)</label>
                <div class="input-row">
                    <input type="text" id="sizeInput" value="1.0">
                    <select id="unitSelect">
                        <option value="MiB">MiB</option>
                        <option value="GiB">GiB</option>
                        <option value="TiB" selected>TiB</option>
                        <option value="PiB">PiB</option>
                        <option value="EiB">EiB</option>
                        <option value="ZiB">ZiB</option>
                        <option value="YiB">YiB</option>
                        <option value="RiB">RiB</option>
                        <option value="QiB">QiB</option>
                    </select>
                </div>
                <div class="input-help">
                    ※「2^120」「1&lt;&lt;100」「0x1p100」「1329227995784915872903807060280344576」などの数式・16進数表記を入力可能。
                </div>
            </div>

            <div class="control-group">
                <label>
                    <span>圧縮レイヤー数 (Nesting Layers)</span>
                    <span class="optimal-badge" id="optimalBadge" style="display:none;" title="1/1032理論限界から算出した最適解">推奨: --層 (適用)</span>
                </label>
                <div class="slider-sync-row">
                    <input type="range" id="layerRange" min="1" max="50" value="15">
                    <input type="number" id="layerInput" min="1" max="5000" value="15">
                </div>
            </div>

            <div class="control-group">
                <label>仮想展開ファイル名</label>
                <input type="text" id="filenameInput" value="bomb.txt">
            </div>

            <div class="control-group">
                <label>各層のファイル名命名規則</label>
                <select id="namingModeSelect">
                    <option value="layer_num" selected>レイヤー番号付与 (~l.gz)</option>
                    <option value="uniform">全層同一 (ファイル名統一)</option>
                    <option value="cumulative">累積拡張子 (.gz 連続)</option>
                </select>
                <div class="input-help">※「~l」は現在の階層番号に自動置換されます。</div>
            </div>

            <div class="prediction-badge">
                <div class="prediction-title">予測される圧縮後サイズ</div>
                <div class="prediction-value" id="predictValue">-- B</div>
                <button type="button" id="predictBtn" style="margin-top: 8px; width: 100%; padding: 8px; background: var(--primary); color: white; border: none; border-radius: 3px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='var(--primary-hover)'" onmouseout="this.style.background='var(--primary)'">予測を計算</button>
            </div>

            <div class="progress-box" id="progressBox">
                <div class="progress-text">
                    <span id="progressState">Initializing...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fg" id="progressBar"></div>
                </div>
            </div>

            <button class="btn-generate" id="generateBtn">生成 & ダウンロード</button>
        </aside>

        <main>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>階層</th>
                            <th>入力サイズ（仮想）</th>
                            <th>出力サイズ</th>
                            <th>削減率</th>
                            <th>CRC32（前層チェック）</th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody">
                    </tbody>
                </table>
            </div>

            <div class="console-container" id="consoleLogs">
                <div class="console-line"><span class="console-tag">[System]</span><span>初期化完了。パラメータを入力して予測または生成を実行してください。</span></div>
            </div>
        </main>
    </div>

    <script>
        const MAX_EXP_BIN = 50000n;
        const MAX_EXP_DEC = 15000n;
        const MAX_LAYERS = 5000;
        const MAX_DOWNLOAD_BYTES = 512 * 1024 * 1024;

        function parseBigSize(valStr) {
            valStr = valStr.trim();
            if (!valStr) return 0n;

            const powMatch = valStr.match(/^(2|10)\s*(\^|\*\*)\s*(\d+)$/);
            if (powMatch) {
                const base = BigInt(powMatch[1]);
                const exp = BigInt(powMatch[3]);
                const limit = base === 2n ? MAX_EXP_BIN : MAX_EXP_DEC;
                if (exp > limit) return null;
                return base ** exp;
            }

            const shiftMatch = valStr.match(/^1\s*<<\s*(\d+)$/);
            if (shiftMatch) {
                const exp = BigInt(shiftMatch[1]);
                if (exp > MAX_EXP_BIN) return null;
                return 1n << exp;
            }

            const hexFloatMatch = valStr.match(/^0[xX]([0-9a-fA-F]+)?(?:\.([0-9a-fA-F]+))?[pP]([+-]?\d+)$/);
            if (hexFloatMatch) {
                const intPartStr = hexFloatMatch[1] || "0";
                const fracPartStr = hexFloatMatch[2] || "";
                if (!hexFloatMatch[1] && !hexFloatMatch[2]) return null;
                const expVal = BigInt(hexFloatMatch[3]);
                const intPart = BigInt("0x" + intPartStr);
                const fracPart = fracPartStr ? BigInt("0x" + fracPartStr) : 0n;
                const fracLen = BigInt(fracPartStr.length);
                const scaledBase = (intPart << (4n * fracLen)) + fracPart;
                const netExp = expVal - 4n * fracLen;
                if (netExp > MAX_EXP_BIN) return null;
                return netExp >= 0n ? (scaledBase << netExp) : (scaledBase >> (-netExp));
            }

            if (/^0[xX][0-9a-fA-F]+$/.test(valStr)) {
                try {
                    return BigInt(valStr);
                } catch {
                    return null;
                }
            }

            if (valStr.includes('.')) {
                const parts = valStr.split('.');
                if (parts.length !== 2 || !/^\d*$/.test(parts[0]) || !/^\d*$/.test(parts[1]) || (parts[0] === '' && parts[1] === '')) {
                    return null;
                }
                try {
                    const integerPart = BigInt(parts[0] || "0");
                    const decimalStr = parts[1].slice(0, 18);
                    return {
                        isFraction: true,
                        integer: integerPart,
                        fraction: BigInt(decimalStr || "0"),
                        fractionLen: BigInt(decimalStr.length)
                    };
                } catch {
                    return null;
                }
            }

            if (/^\d+$/.test(valStr)) {
                try {
                    return BigInt(valStr);
                } catch {
                    return null;
                }
            }
            return null;
        }

        const UNIT_MULTIPLIERS = {
            "Bytes": 1n,
            "KiB": 1024n,
            "MiB": 1024n ** 2n,
            "GiB": 1024n ** 3n,
            "TiB": 1024n ** 4n,
            "PiB": 1024n ** 5n,
            "EiB": 1024n ** 6n,
            "ZiB": 1024n ** 7n,
            "YiB": 1024n ** 8n,
            "RiB": 1024n ** 9n,
            "QiB": 1024n ** 10n
        };

        const layerRange = document.getElementById('layerRange');
        const layerInput = document.getElementById('layerInput');
        const sizeInput = document.getElementById('sizeInput');
        const unitSelect = document.getElementById('unitSelect');
        const predictBtn = document.getElementById('predictBtn');
        const generateBtn = document.getElementById('generateBtn');

        layerRange.addEventListener('input', () => {
            layerInput.value = layerRange.value;
            triggerFastUpdate();
        });
        layerInput.addEventListener('input', () => {
            let val = parseInt(layerInput.value, 10);
            if (isNaN(val) || val < 1) val = 1;
            if (val > MAX_LAYERS) val = MAX_LAYERS;
            layerRange.value = Math.min(val, 50);
            triggerFastUpdate();
        });
        sizeInput.addEventListener('input', () => {
            updateOptimalDisplay();
            triggerFastUpdate();
        });
        unitSelect.addEventListener('change', () => {
            updateOptimalDisplay();
            triggerFastUpdate();
        });
        document.getElementById('filenameInput').addEventListener('input', triggerFastUpdate);
        document.getElementById('namingModeSelect').addEventListener('change', triggerFastUpdate);

        document.getElementById('optimalBadge').addEventListener('click', () => {
            const bytes = getTargetSizeBytes();
            if (bytes > 0n) {
                const opt = Math.min(calculateOptimalLayers(bytes), MAX_LAYERS);
                layerInput.value = opt;
                layerRange.value = Math.min(opt, 50);
                addLog("Opt", `最適レイヤー数 ${opt} 層を適用しました (1/1032 理論限界・1MiB境界基準)`, "ok");
                triggerFastUpdate();
            }
        });

        function computeLayerFilename(base, count, mode) {
            if (count === 0) return base.replace(/~l/g, '0');
            if (base.includes('~l')) return base.replace(/~l/g, count);
            if (mode === 'uniform') return base.endsWith('.gz') ? base : `${base}.gz`;
            if (mode === 'layer_num') return `${base}~l.gz`.replace(/~l/g, count);
            return base + ".gz".repeat(count);
        }

        function calculateOptimalLayers(targetSizeBytes) {
            const ONE_MIB = 1048576n;
            if (targetSizeBytes <= ONE_MIB) {
                return targetSizeBytes <= 1024n ? 1 : 2;
            }
            const B = targetSizeBytes.toString(2).length - 1;
            const cruiseLayers = (B - 20) / 10.0112;
            return Math.ceil(cruiseLayers) + 2;
        }

        function updateOptimalDisplay() {
            const bytes = getTargetSizeBytes();
            const badge = document.getElementById('optimalBadge');
            if (!badge) return;
            if (bytes <= 0n) {
                badge.innerText = "推奨: --層";
                badge.style.display = "none";
                return;
            }
            const opt = Math.min(calculateOptimalLayers(bytes), MAX_LAYERS);
            badge.innerText = `推奨: ${opt}層 (適用)`;
            badge.style.display = "inline-block";
        }

        function getTargetSizeBytes() {
            const valStr = sizeInput.value.trim();
            const parsed = parseBigSize(valStr);
            if (parsed === null) {
                sizeInput.style.borderColor = "#EF4444";
                return -1n;
            }
            sizeInput.style.borderColor = "";
            const mult = UNIT_MULTIPLIERS[unitSelect.value];
            if (!mult) return 0n;

            if (parsed && parsed.isFraction) {
                const intVal = parsed.integer * mult;
                const decVal = (parsed.fraction * mult) / (10n ** parsed.fractionLen);
                return intVal + decVal;
            }
            return BigInt(parsed) * mult;
        }

        function formatBytes(bytes) {
            const bi = BigInt(bytes);
            if (bi < 1024n) return bi + " B";
            const units = ["KiB", "MiB", "GiB", "TiB", "PiB", "EiB", "ZiB", "YiB", "RiB", "QiB"];
            let idx = -1;
            let temp = bi;
            while (temp >= 1024n && idx < units.length - 1) {
                temp /= 1024n;
                idx++;
            }
            const divider = 1024n ** BigInt(idx + 1);
            const integerPart = bi / divider;
            const intStr = integerPart.toString();
            if (intStr.length > 18) {
                const bitLen = bi.toString(2).length - 1;
                return `${intStr[0]}.${intStr.slice(1, 3)}e+${intStr.length - 1} ${units[idx]} (~2^${bitLen} B)`;
            }
            const remainder = bi % divider;
            const fractionalPart = (remainder * 100n) / divider;
            return intStr + "." + fractionalPart.toString().padStart(2, '0') + " " + units[idx];
        }

        function formatRatioPercent(compressed, uncompressed) {
            if (uncompressed <= 0n) return "0.000000%";
            const scaled = (compressed * 100000000n) / uncompressed;
            if (scaled === 0n && compressed > 0n) return "< 0.000001%";
            return (Number(scaled) / 1e6).toFixed(6) + "%";
        }

        function addLog(tag, message, level = "info") {
            const consoleBox = document.getElementById('consoleLogs');
            const line = document.createElement('div');
            line.className = 'console-line';

            const tagEl = document.createElement('span');
            tagEl.className = 'console-tag' + (level === 'err' ? ' err' : level === 'ok' ? ' ok' : '');
            tagEl.textContent = `[${tag}]`;

            const msgEl = document.createElement('span');
            msgEl.textContent = message;

            line.appendChild(tagEl);
            line.appendChild(msgEl);
            consoleBox.appendChild(line);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function triggerFastUpdate() {
            document.getElementById('predictValue').innerText = "-- B";
        }

        let worker = null;
        let currentAction = null;

        function setBusyState(busy, action = null) {
            currentAction = busy ? action : null;
            predictBtn.disabled = busy;
            generateBtn.disabled = busy;
            if (busy && action === 'predict') {
                predictBtn.innerText = "計算中（スレッド分離）...";
            } else {
                predictBtn.innerText = "予測を計算";
            }
            if (!busy) {
                document.getElementById('progressBox').style.display = "none";
            }
        }

        function appendLayerRow(data) {
            const tableBody = document.getElementById('statsTableBody');
            const tr = document.createElement('tr');
            const rawUncompressed = BigInt(data.uncompressed);
            const rawCompressed = BigInt(data.compressed);

            const cells = [
                { text: `L${data.layer}`, cls: "mono", style: "font-weight: 600;" },
                { text: formatBytes(rawUncompressed), cls: "mono" },
                { text: formatBytes(rawCompressed), cls: "mono" },
                { badge: formatRatioPercent(rawCompressed, rawUncompressed) },
                { text: data.crc, cls: "mono", style: "color: var(--text-sub); font-size: 0.8rem;" }
            ];

            for (const c of cells) {
                const td = document.createElement('td');
                if (c.cls) td.className = c.cls;
                if (c.style) td.setAttribute('style', c.style);
                if (c.badge) {
                    const span = document.createElement('span');
                    span.className = 'ratio-badge';
                    span.textContent = c.badge;
                    td.appendChild(span);
                } else {
                    td.textContent = c.text;
                }
                tr.appendChild(td);
            }
            tableBody.appendChild(tr);
        }

        function initWorker() {
            if (worker) return;
            const codeElement = document.getElementById('predictionWorkerCode');
            const blob = new Blob([codeElement.textContent], { type: 'application/javascript' });
            const workerUrl = URL.createObjectURL(blob);
            worker = new Worker(workerUrl);
            URL.revokeObjectURL(workerUrl);

            worker.onmessage = function(e) {
                const { type, data, finalSize, buffer, message } = e.data;

                if (type === 'layer_progress') {
                    appendLayerRow(data);
                    if (currentAction === 'generate') {
                        const pct = Math.floor((data.layer / data.totalLayers) * 100);
                        document.getElementById('progressState').textContent = `Compressing Layer ${data.layer}/${data.totalLayers}...`;
                        document.getElementById('progressPercent').textContent = `${pct}%`;
                        document.getElementById('progressBar').style.width = `${pct}%`;
                    }
                    addLog(
                        currentAction === 'generate' ? "Gen" : "Progress",
                        `L${data.layer} 処理完了: ${formatBytes(BigInt(data.uncompressed))} -> ${formatBytes(BigInt(data.compressed))}`
                    );
                } else if (type === 'prediction_complete') {
                    document.getElementById('predictValue').innerText = formatBytes(BigInt(finalSize));
                    setBusyState(false);
                    addLog("Success", `計算完了。最終サイズ予測: ${formatBytes(BigInt(finalSize))}`, "ok");
                } else if (type === 'generation_complete') {
                    document.getElementById('predictValue').innerText = formatBytes(BigInt(finalSize));
                    const baseFilename = document.getElementById('filenameInput').value;
                    const count_layers = parseInt(layerInput.value, 10);
                    const namingMode = document.getElementById('namingModeSelect').value;
                    let downloadFilename = computeLayerFilename(baseFilename, count_layers, namingMode);
                    if (namingMode === 'uniform' && !downloadFilename.endsWith('.gz')) {
                        downloadFilename += '.gz';
                    }
                    if (!downloadFilename) downloadFilename = "output.gz";

                    const outBlob = new Blob([buffer], { type: "application/gzip" });
                    const url = URL.createObjectURL(outBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = downloadFilename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    setBusyState(false);
                    addLog("Success", `ファイル「${downloadFilename}」(${formatBytes(BigInt(finalSize))}) の書き出し完了。`, "ok");
                } else if (type === 'worker_error') {
                    setBusyState(false);
                    addLog("Error", message || "不明なエラーが発生しました。", "err");
                }
            };

            worker.onerror = function(err) {
                setBusyState(false);
                if (worker) {
                    worker.terminate();
                    worker = null;
                }
                addLog("Error", `Workerスレッドでエラーが発生しました: ${err.message}`, "err");
            };
        }

        function startWorkerJob(action) {
            const target_size_setting = getTargetSizeBytes();
            const count_layers = parseInt(layerInput.value, 10);
            const filename = document.getElementById('filenameInput').value;
            const namingMode = document.getElementById('namingModeSelect').value;

            if (target_size_setting === -1n) {
                addLog("Error", "入力サイズが解析不能な形式（数式・数値エラーまたは指数上限超過）です。", "err");
                return;
            }
            if (target_size_setting <= 0n || isNaN(count_layers) || count_layers < 1 || count_layers > MAX_LAYERS) {
                addLog("Error", `パラメータが正しくありません。サイズとレイヤー数(1〜${MAX_LAYERS})を確認してください。`, "err");
                return;
            }

            initWorker();
            setBusyState(true, action);

            if (action === 'predict') {
                document.getElementById('predictValue').innerText = "Calculating...";
                document.getElementById('statsTableBody').innerHTML = '';
                addLog("System", "バックグラウンドでの圧縮予測シミュレーションを開始しました。");
            } else {
                const progressBox = document.getElementById('progressBox');
                progressBox.style.display = "flex";
                document.getElementById('progressState').textContent = "Generating in Worker...";
                document.getElementById('progressPercent').textContent = "0%";
                document.getElementById('progressBar').style.width = "0%";
                if (document.getElementById('predictValue').innerText === "-- B") {
                    document.getElementById('statsTableBody').innerHTML = '';
                }
                addLog("Gen", "Web Workerで圧縮ファイルの生成を開始しました。");
            }

            worker.postMessage({
                action,
                target_size_setting_str: target_size_setting.toString(),
                count_layers,
                filename,
                naming_mode: namingMode,
                max_download_bytes: MAX_DOWNLOAD_BYTES
            });
        }

        predictBtn.addEventListener('click', () => startWorkerJob('predict'));
        generateBtn.addEventListener('click', () => startWorkerJob('generate'));

        document.getElementById('predictValue').innerText = "-- B";
        updateOptimalDisplay();
    </script>
</body>
</html>
