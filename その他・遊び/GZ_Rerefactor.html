                                        } else {
                                            const [sl_len, ___] = get_len_literal(slice_chunk.length);
                                            const [sl_dist, ____] = get_dist_literal(token.data.length);
                                            lit_count[sl_len] = (lit_count[sl_len] || 0) + Number(token.times - 1n);
                                            dist_count[sl_dist] = (dist_count[sl_dist] || 0) + Number(token.times - 1n);
                                        }
                                    }
                                }
                            }
                        }

                        lit_count[0x100] = (lit_count[0x100] || 0) + 1;

                        const lit_huffman = huffman_encoding(lit_count, 15);
                        const dist_huffman = huffman_encoding(dist_count, 15);
                        const lit_table = generate_encoding(lit_huffman);
                        const dist_table = generate_encoding(dist_huffman);

                        stream.push(is_final ? '1' : '0');
                        stream.push('01');
                        stream.push(get_huffman_block(lit_huffman, dist_huffman));

                        for (const token of chunk_tokens) {
                            const lzss_res = lzss_compress(token.data);
                            const data_huffman_list = [];
                            for (const datum of lzss_res) {
                                if (datum.type === "value") {
                                    data_huffman_list.push(lit_table[datum.value]);
                                } else if (datum.type === "copy") {
                                    const [len_literal, len_bits] = get_len_literal(datum.len);
                                    const [dist_literal, dist_bits] = get_dist_literal(datum.dist);
                                    data_huffman_list.push(lit_table[len_literal] + len_bits + dist_table[dist_literal] + dist_bits);
                                }
                            }
                            const data_huffman = data_huffman_list.join('');

                            if (258 % token.data.length === 0 && token.times - 1n > 0n) {
                                const per_chunk = BigInt(258 / token.data.length);
                                const remaining_tokens = (token.times - 1n) % per_chunk;

                                stream.push(data_huffman);

                                const [len_literal, len_bits] = get_len_literal(258);
                                const [dist_literal, dist_bits] = get_dist_literal(token.data.length);
                                const repetition_data = lit_table[len_literal] + len_bits + dist_table[dist_literal] + dist_bits;

                                stream.push_repeat(repetition_data, (token.times - 1n) / per_chunk);

                                if (remaining_tokens < 3n) {
                                    stream.push_repeat(data_huffman, remaining_tokens);
                                } else {
                                    const [rem_len, rem_len_b] = get_len_literal(token.data.length * Number(remaining_tokens));
                                    const [rem_dist, rem_dist_b] = get_dist_literal(token.data.length);
                                    stream.push(lit_table[rem_len] + rem_len_b + dist_table[rem_dist] + rem_dist_b);
                                }
                            } else {
                                stream.push(data_huffman);
                                if (token.times > 1n) {
                                    const slice_size = 258; // ★ 追加箇所（不具合1の修正）
                                    const repetition_data_list = [];
                                    for (let slice_start = 0; slice_start < token.data.length; slice_start += slice_size) {
                                        const slice_chunk = token.data.slice(slice_start, slice_start + slice_size);
                                        if (slice_chunk.length < 3) {
                                            repetition_data_list.push(Array.from(slice_chunk).map(b => lit_table[b]).join(''));
                                        } else {
                                            const [sl_len, sl_len_b] = get_len_literal(slice_chunk.length);
                                            const [sl_dist, sl_dist_b] = get_dist_literal(token.data.length);
                                            repetition_data_list.push(lit_table[sl_len] + sl_len_b + dist_table[sl_dist] + sl_dist_b);
                                        }
                                    }
                                    const repetition_data = repetition_data_list.join('');
                                    stream.push_repeat(repetition_data, token.times - 1n);
                                }
                            }
                        }
                        stream.push(lit_table[0x100]);
                    }

                    stream.align();
                    stream.push(unpack_b(pack32LE(data_crc)));
                    stream.push(unpack_b(pack32LE(data_size & 0xFFFFFFFFn)));

                    const compressed_size = stream.tokens.reduce((sum, d) => sum + BigInt(d.data.length) * d.times, 0n);
                    
                    addLog("Gen", `L${layer_index+1} 圧縮処理完了: ${formatBytes(data_size)} -> ${formatBytes(compressed_size)}`);

                    tokens = stream.tokens;
                    data_crc = stream.get_crc();

                    layer_index++;
                    requestAnimationFrame(compressLayerStep);
                }

                compressLayerStep();
            }, 50);
        }

        // 生成とダウンロードの実行
        document.getElementById('generateBtn').addEventListener('click', () => {
            const target_size_setting = getTargetSizeBytes();
            const count_layers = parseInt(layerInput.value);
            if (target_size_setting <= 0n || isNaN(count_layers) || count_layers < 1) {
                addLog("Error", "パラメータが正しくありません。数式入力やレイヤー数を確認してください。", "err");
                return;
            }

            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;
            generateBtn.style.opacity = 0.5;

            runAsyncCompression((stream) => {
                const finalBytes = stream.to_bytes();
                const baseFilename = document.getElementById('filenameInput').value;
                const namingMode = document.getElementById('namingModeSelect').value;
                let downloadFilename = computeLayerFilename(baseFilename, count_layers, namingMode);
                if (namingMode === 'uniform' && !downloadFilename.endsWith('.gz')) {
                    downloadFilename += '.gz';
                }
                
                const blob = new Blob([finalBytes], {type: "application/gzip"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = downloadFilename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                generateBtn.disabled = false;
                generateBtn.style.opacity = 1;
                addLog("Success", `ファイル「${downloadFilename}」の書き出し完了。自動DLが開始されました。`);
            });
        });

        // -----------------------------------------------------------------
        // Web Worker（別スレッド）管理部＆メインUIハンドラ
        // -----------------------------------------------------------------
        let predictionWorker = null;

        function initWorker() {
            if (predictionWorker) return;
            const codeElement = document.getElementById('predictionWorkerCode');
            const blob = new Blob([codeElement.textContent], { type: 'application/javascript' });
            predictionWorker = new Worker(URL.createObjectURL(blob));

            // Worker からメッセージ受信したときのハンドラ（DOM更新はすべてメイン側で担当）
            predictionWorker.onmessage = function(e) {
                const { type, data, finalSize } = e.data;
                
                if (type === 'layer_progress') {
                    const tableBody = document.getElementById('statsTableBody');
                    const tr = document.createElement('tr');
                    const rawUncompressed = BigInt(data.uncompressed);
                    const rawCompressed = BigInt(data.compressed);
                    const pct = ((Number(rawCompressed) / Number(rawUncompressed)) * 100).toFixed(6);
                    
                    tr.innerHTML = `
                        <td class="mono" style="font-weight: 600;">L${data.layer}</td>
                        <td class="mono">${formatBytes(rawUncompressed)}</td>
                        <td class="mono">${formatBytes(rawCompressed)}</td>
                        <td><span class="ratio-badge">${pct}%</span></td>
                        <td class="mono" style="color: var(--text-sub); font-size: 0.8rem;">${data.crc}</td>
                    `;
                    tableBody.appendChild(tr);
                    
                    addLog("Progress", `L${data.layer} 処理完了: ${formatBytes(rawUncompressed)} ➔ ${formatBytes(rawCompressed)}`, "sys");
                } else if (type === 'prediction_complete') {
                    document.getElementById('predictValue').innerText = formatBytes(BigInt(finalSize));
                    resetPredictButton();
                    addLog("Success", `スレッド処理完了。最終サイズ予測: ${formatBytes(BigInt(finalSize))}`, "ok");
                }
            };

            predictionWorker.onerror = function(err) {
                addLog("Error", `Workerスレッドでエラーが発生しました: ${err.message}`, "err");
                resetPredictButton();
            };
        }

        function resetPredictButton() {
            const predictBtn = document.getElementById('predictBtn');
            predictBtn.disabled = false;
            predictBtn.innerText = "予測を計算";
        }

        // 重複定義されていたため削除

        // 手動予測起動ハンドラ（Worker経由）
        document.getElementById('predictBtn').addEventListener('click', () => {
            const target_size_setting = getTargetSizeBytes();
            const count_layers = parseInt(layerInput.value);
            const filename = document.getElementById('filenameInput').value;

            if (target_size_setting === -1n) {
                addLog("Error", "入力サイズが解析不能な形式（数式または数値エラー）です。", "err");
                return;
            }
            if (target_size_setting === 0n || isNaN(count_layers) || count_layers < 1) {
                addLog("Error", "正しいパラメータが指定されていません。", "err");
                return;
            }

            // Workerの初期化
            initWorker();

            // UIをロード中に変更（メインは一切フリーズしません）
            const predictBtn = document.getElementById('predictBtn');
            predictBtn.disabled = true;
            predictBtn.innerText = "計算中（スレッド分離）...";
            document.getElementById('predictValue').innerText = "Calculating...";
            
            const tableBody = document.getElementById('statsTableBody');
            tableBody.innerHTML = ''; // テーブルをクリア

            addLog("System", "スレッドを起動し、バックグラウンドでのシミュレーションを開始しました。", "sys");

            const namingMode = document.getElementById('namingModeSelect').value;

            // Workerへ投げる（BigIntはそのまま渡せないので文字列化する）
            predictionWorker.postMessage({
                target_size_setting_str: target_size_setting.toString(),
                count_layers: count_layers,
                filename: filename,
                naming_mode: namingMode
            });
        });

        // 初回はフリーズ防止のため自動実行しない
        document.getElementById('predictValue').innerText = "-- B";
        updateOptimalDisplay();
    </script>
</body>
