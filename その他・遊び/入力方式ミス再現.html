<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キーボード配列 誤打鍵 相互変換器</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            text-align: center;
            font-size: 1.4em;
            margin-top: 0;
            color: #2c3e50;
        }
        p.description {
            font-size: 0.9em;
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }
        .box {
            background: #fdfdfd;
            border: 1px solid #e1e8ed;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .box.middle {
            background: #f0f4f8;
            border-style: dashed;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95em;
            color: #34495e;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 1em;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #fff;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1.1em;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        #qwerty {
            font-family: monospace;
            color: #555;
            font-size: 1em;
        }
        .arrow {
            text-align: center;
            font-size: 1.5em;
            color: #bdc3c7;
            margin: -5px 0 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⌨️ 誤打鍵 相互変換器</h2>
    <p class="description">打ったつもりの入力方式と、実際のキーボード状態を選んでください。</p>

    <!-- 入力セクション -->
    <div class="box">
        <label>1. 入力した文字（打ったつもり）</label>
        <select id="inputType">
            <option value="romaji">ひらがな（ローマ字入力）</option>
            <option value="jiskana">ひらがな（JISかな入力）</option>
            <option value="dubeol">ハングル（2ボル式）</option>
        </select>
        <textarea id="input" rows="3" placeholder="ここに入力してください"></textarea>
    </div>

    <div class="arrow">⬇️</div>

    <!-- 中間状態セクション -->
    <div class="box middle">
        <label>2. 実際のキーストローク（QWERTY英字）</label>
        <textarea id="qwerty" rows="2" readonly placeholder="英字のストロークが表示されます"></textarea>
    </div>

    <div class="arrow">⬇️</div>

    <!-- 出力セクション -->
    <div class="box">
        <label>3. 変換結果（実際のキーボード設定）</label>
        <select id="outputType">
            <option value="dubeol">ハングル（2ボル式）</option>
            <option value="romaji">ひらがな（ローマ字入力）</option>
            <option value="jiskana">ひらがな（JISかな入力）</option>
        </select>
        <textarea id="output" rows="3" readonly placeholder="結果がここに表示されます"></textarea>
    </div>
</div>

<script>
    // ==========================================
    // 辞書・マッピングデータ
    // ==========================================

    // --- ローマ字・ひらがな関連 ---
    const kana2romaji = {
        'あ':'a', 'い':'i', 'う':'u', 'え':'e', 'お':'o',
        'か':'ka', 'き':'ki', 'く':'ku', 'け':'ke', 'こ':'ko',
        'さ':'sa', 'し':'shi', 'す':'su', 'せ':'se', 'そ':'so',
        'た':'ta', 'ち':'chi', 'つ':'tsu', 'て':'te', 'と':'to',
        'な':'na', 'に':'ni', 'ぬ':'nu', 'ね':'ne', 'の':'no',
        'は':'ha', 'ひ':'hi', 'ふ':'fu', 'へ':'he', 'ほ':'ho',
        'ま':'ma', 'み':'mi', 'む':'mu', 'め':'me', 'も':'mo',
        'や':'ya', 'ゆ':'yu', 'よ':'yo',
        'ら':'ra', 'り':'ri', 'る':'ru', 'れ':'re', 'ろ':'ro',
        'わ':'wa', 'を':'wo', 'ん':'nn',
        'が':'ga', 'ぎ':'gi', 'ぐ':'gu', 'げ':'ge', 'ご':'go',
        'ざ':'za', 'じ':'ji', 'ず':'zu', 'ぜ':'ze', 'ぞ':'zo',
        'だ':'da', 'ぢ':'ji', 'づ':'zu', 'で':'de', 'ど':'do',
        'ば':'ba', 'び':'bi', 'ぶ':'bu', 'べ':'be', 'ぼ':'bo',
        'ぱ':'pa', 'ぴ':'pi', 'ぷ':'pu', 'ぺ':'pe', 'ぽ':'po',
        'きゃ':'kya', 'きゅ':'kyu', 'きょ':'kyo', 'しゃ':'sha', 'しゅ':'shu', 'しょ':'sho',
        'ちゃ':'cha', 'ちゅ':'chu', 'ちょ':'cho', 'にゃ':'nya', 'にゅ':'nyu', 'にょ':'nyo',
        'ひゃ':'hya', 'ひゅ':'hyu', 'ひょ':'hyo', 'みゃ':'mya', 'みゅ':'myu', 'みょ':'myo',
        'りゃ':'rya', 'りゅ':'ryu', 'りょ':'ryo', 'ぎゃ':'gya', 'ぎゅ':'gyu', 'ぎょ':'gyo',
        'じゃ':'ja', 'じゅ':'ju', 'じょ':'jo', 'びゃ':'bya', 'びゅ':'byu', 'びょ':'byo',
        'ぴゃ':'pya', 'ぴゅ':'pyu', 'ぴょ':'pyo',
        'ぁ':'xa', 'ぃ':'xi', 'ぅ':'xu', 'ぇ':'xe', 'ぉ':'xo', 'ゃ':'xya', 'ゅ':'xyu', 'ょ':'xyo',
        'ー':'-', '、':',', '。':'.', '！':'!', '？':'?', '「':'[', '」':']', '・':'/'
    };
    const romajiToKanaMap = {};
    for (let k in kana2romaji) romajiToKanaMap[kana2romaji[k]] = k;
    // 一部表記ゆれ対応
    Object.assign(romajiToKanaMap, {
        'si':'し', 'ti':'ち', 'tu':'つ', 'hu':'ふ', 'zi':'じ', 'di':'ぢ', 'du':'づ',
        'sya':'しゃ', 'syu':'しゅ', 'syo':'しょ', 'tya':'ちゃ', 'tyu':'ちゅ', 'tyo':'ちょ',
        'zya':'じゃ', 'zyu':'じゅ', 'zyo':'じょ', 'xtsu':'っ'
    });

    // --- ハングル 2ボル式関連 ---
    const JAMO_MAP = {
        'q':'ㅂ', 'w':'ㅈ', 'e':'ㄷ', 'r':'ㄱ', 't':'ㅅ', 'y':'ㅛ', 'u':'ㅕ', 'i':'ㅑ', 'o':'ㅐ', 'p':'ㅔ',
        'a':'ㅁ', 's':'ㄴ', 'd':'ㅇ', 'f':'ㄹ', 'g':'ㅎ', 'h':'ㅗ', 'j':'ㅓ', 'k':'ㅏ', 'l':'ㅣ',
        'z':'ㅋ', 'x':'ㅌ', 'c':'ㅊ', 'v':'ㅍ', 'b':'ㅠ', 'n':'ㅜ', 'm':'ㅡ',
        'Q':'ㅃ', 'W':'ㅉ', 'E':'ㄸ', 'R':'ㄲ', 'T':'ㅆ', 'O':'ㅒ', 'P':'ㅖ'
    };
    const KOR_TO_ENG = {};
    for (let k in JAMO_MAP) KOR_TO_ENG[JAMO_MAP[k]] = k;

    const CHOSEONG =['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const JUNGSEONG =['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
    const JONGSEONG =['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

    const COMPLEX_VOWELS = { 'ㅗㅏ':'ㅘ', 'ㅗㅐ':'ㅙ', 'ㅗㅣ':'ㅚ', 'ㅜㅓ':'ㅝ', 'ㅜㅔ':'ㅞ', 'ㅜㅣ':'ㅟ', 'ㅡㅣ':'ㅢ' };
    const COMPLEX_CONSONANTS = { 'ㄱㅅ':'ㄳ', 'ㄴㅈ':'ㄵ', 'ㄴㅎ':'ㄶ', 'ㄹㄱ':'ㄺ', 'ㄹㅁ':'ㄻ', 'ㄹㅂ':'ㄼ', 'ㄹㅅ':'ㄽ', 'ㄹㅌ':'ㄾ', 'ㄹㅍ':'ㄿ', 'ㄹㅎ':'ㅀ', 'ㅂㅅ':'ㅄ' };
    
    const COMPLEX_VOWELS_SPLIT = { 'ㅘ':['ㅗ','ㅏ'], 'ㅙ':['ㅗ','ㅐ'], 'ㅚ':['ㅗ','ㅣ'], 'ㅝ':['ㅜ','ㅓ'], 'ㅞ':['ㅜ','ㅔ'], 'ㅟ':['ㅜ','ㅣ'], 'ㅢ':['ㅡ','ㅣ'] };
    const COMPLEX_CONSONANTS_SPLIT = { 'ㄳ':['ㄱ','ㅅ'], 'ㄵ':['ㄴ','ㅈ'], 'ㄶ':['ㄴ','ㅎ'], 'ㄺ':['ㄹ','ㄱ'], 'ㄻ':['ㄹ','ㅁ'], 'ㄼ':['ㄹ','ㅂ'], 'ㄽ':['ㄹ','ㅅ'], 'ㄾ':['ㄹ','ㅌ'], 'ㄿ':['ㄹ','ㅍ'], 'ㅀ':['ㄹ','ㅎ'], 'ㅄ':['ㅂ','ㅅ'] };

    // --- JISかな関連 ---
    const engToKanaMap = {
        '1':'ぬ','2':'ふ','3':'あ','4':'う','5':'え','6':'お','7':'や','8':'ゆ','9':'よ','0':'わ','-':'ほ','^':'へ','\\':'ー',
        'q':'た','w':'て','e':'い','r':'す','t':'か','y':'ん','u':'な','i':'に','o':'ら','p':'せ','@':'゛','[':'゜',
        'a':'ち','s':'と','d':'し','f':'は','g':'き','h':'く','j':'ま','k':'の','l':'り',';':'れ',':':'け',']':'む',
        'z':'つ','x':'さ','c':'そ','v':'ひ','b':'こ','n':'み','m':'も',',':'ね','.':'る','/':'め', '_':'ろ',
        // Shiftあり
        '!':'ぬ','"':'ふ','#':'ぁ','$':'ぅ','%':'ぇ','&':'ぉ','\'':'ゃ','(':'ゅ',')':'ょ','~':'を','=':'ほ',
        'Q':'た','W':'て','E':'ぃ','R':'す','T':'か','Y':'ん','U':'な','I':'に','O':'ら','P':'せ','`':'゛','{':'゜',
        'A':'ち','S':'と','D':'し','F':'は','G':'き','H':'く','J':'ま','K':'の','L':'り','+':'れ','*':'け','}':'む',
        'Z':'っ','X':'さ','C':'そ','V':'ひ','B':'こ','N':'み','M':'も','<':'、','>':'。','?':'・'
    };
    const baseKanaToEngMap = {};
    for (let k in engToKanaMap) if (!baseKanaToEngMap[engToKanaMap[k]]) baseKanaToEngMap[engToKanaMap[k]] = k;
    
    const dakuToSei = {'が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ','ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ','だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と','ば':'は','び':'ひ','ぶ':'ふ','べ':'へ','ぼ':'ほ','ヴ':'ウ'};
    const handakuToSei = {'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ'};


    // ==========================================
    // デコーダー (各入力 -> QWERTY英字)
    // ==========================================

    function kataToHira(str) { return str.replace(/[\u30A1-\u30F6]/g, match => String.fromCharCode(match.charCodeAt(0) - 0x60)); }

    function decodeRomaji(text) {
        text = kataToHira(text);
        let romaji = "";
        for (let i = 0; i < text.length; i++) {
            let c = text[i], nextC = text[i+1];
            if (nextC && kana2romaji[c + nextC]) { romaji += kana2romaji[c + nextC]; i++; continue; }
            if (c === 'っ') {
                let nextR = nextC ? (kana2romaji[nextC + text[i+2]] || kana2romaji[nextC]) : null;
                if (nextR && !['a','i','u','e','o'].includes(nextR[0])) { romaji += nextR[0]; continue; }
                else { romaji += 'xtsu'; continue; }
            }
            romaji += kana2romaji[c] || c;
        }
        return romaji;
    }

    function decodeDubeol(korStr) {
        let result = '';
        for (let i = 0; i < korStr.length; i++) {
            let code = korStr.charCodeAt(i);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                let idx = code - 0xAC00;
                let cho = CHOSEONG[Math.floor(idx / 588)];
                let jung = JUNGSEONG[Math.floor((idx % 588) / 28)];
                let jong = JONGSEONG[idx % 28];
                
                result += KOR_TO_ENG[cho] || cho;
                if (COMPLEX_VOWELS_SPLIT[jung]) { result += KOR_TO_ENG[COMPLEX_VOWELS_SPLIT[jung][0]] + KOR_TO_ENG[COMPLEX_VOWELS_SPLIT[jung][1]]; }
                else { result += KOR_TO_ENG[jung] || jung; }
                if (jong) {
                    if (COMPLEX_CONSONANTS_SPLIT[jong]) { result += KOR_TO_ENG[COMPLEX_CONSONANTS_SPLIT[jong][0]] + KOR_TO_ENG[COMPLEX_CONSONANTS_SPLIT[jong][1]]; }
                    else { result += KOR_TO_ENG[jong] || jong; }
                }
            } else {
                let c = korStr[i];
                if (KOR_TO_ENG[c]) result += KOR_TO_ENG[c];
                else if (COMPLEX_VOWELS_SPLIT[c]) result += KOR_TO_ENG[COMPLEX_VOWELS_SPLIT[c][0]] + KOR_TO_ENG[COMPLEX_VOWELS_SPLIT[c][1]];
                else if (COMPLEX_CONSONANTS_SPLIT[c]) result += KOR_TO_ENG[COMPLEX_CONSONANTS_SPLIT[c][0]] + KOR_TO_ENG[COMPLEX_CONSONANTS_SPLIT[c][1]];
                else result += c;
            }
        }
        return result;
    }

    function decodeJisKana(kanaStr) {
        kanaStr = kataToHira(kanaStr);
        let result = '';
        for (let i = 0; i < kanaStr.length; i++) {
            let c = kanaStr[i];
            if (dakuToSei[c]) result += (baseKanaToEngMap[dakuToSei[c]] || dakuToSei[c]) + '@';
            else if (handakuToSei[c]) result += (baseKanaToEngMap[handakuToSei[c]] || handakuToSei[c]) + '[';
            else result += baseKanaToEngMap[c] || c;
        }
        return result;
    }


    // ==========================================
    // エンコーダー (QWERTY英字 -> 各出力)
    // ==========================================

    function encodeRomaji(qwerty) {
        let result = '', i = 0;
        while (i < qwerty.length) {
            let isMatch = false;
            // 促音
            if (i + 1 < qwerty.length && qwerty[i] === qwerty[i+1] && /^[bcdfghjklmpqrstvwxyz]$/i.test(qwerty[i]) && qwerty[i].toLowerCase() !== 'n') {
                result += 'っ'; i++; continue;
            }
            // 撥音
            if (qwerty[i].toLowerCase() === 'n' && i + 1 < qwerty.length && !['a','i','u','e','o','y','n'].includes(qwerty[i+1].toLowerCase())) {
                result += 'ん'; i++; continue;
            }
            // 最長一致検索
            for (let len = 4; len > 0; len--) {
                if (i + len <= qwerty.length) {
                    let chunk = qwerty.substring(i, i + len).toLowerCase();
                    if (romajiToKanaMap[chunk]) { result += romajiToKanaMap[chunk]; i += len; isMatch = true; break; }
                }
            }
            if (!isMatch) { result += qwerty[i]; i++; }
        }
        return result;
    }

    function combineHangul(cho, jung, jong = '') {
        return String.fromCharCode(0xAC00 + (CHOSEONG.indexOf(cho) * 21 * 28) + (JUNGSEONG.indexOf(jung) * 28) + JONGSEONG.indexOf(jong));
    }

    function encodeDubeol(qwertyStr) {
        let result = "", state = 0, curCho = "", curJung = "", curJong = "";
        const SPLIT_CC = {}; for (let k in COMPLEX_CONSONANTS) SPLIT_CC[COMPLEX_CONSONANTS[k]] = k;

        function flush() {
            if (state === 1) result += curCho;
            else if (state === 2) result += curJung;
            else if (state === 3) result += combineHangul(curCho, curJung);
            else if (state === 4) result += combineHangul(curCho, curJung, curJong);
            state = 0; curCho = ""; curJung = ""; curJong = "";
        }

        for (let i = 0; i < qwertyStr.length; i++) {
            let char = qwertyStr[i];
            let jamo = JAMO_MAP[char] || char;

            if (!JAMO_MAP[char] && !JAMO_MAP[char.toLowerCase()]) { flush(); result += char; continue; }

            let isC = CHOSEONG.includes(jamo), isV = JUNGSEONG.includes(jamo);

            switch (state) {
                case 0:
                    if (isC) { curCho = jamo; state = 1; } else { curJung = jamo; state = 2; } break;
                case 1:
                    if (isC) { flush(); curCho = jamo; state = 1; } else { curJung = jamo; state = 3; } break;
                case 2:
                    if (isV) {
                        if (COMPLEX_VOWELS[curJung + jamo]) curJung = COMPLEX_VOWELS[curJung + jamo];
                        else { flush(); curJung = jamo; state = 2; }
                    } else { flush(); curCho = jamo; state = 1; } break;
                case 3:
                    if (isV) {
                        if (COMPLEX_VOWELS[curJung + jamo]) curJung = COMPLEX_VOWELS[curJung + jamo];
                        else { flush(); curJung = jamo; state = 2; }
                    } else {
                        if (JONGSEONG.includes(jamo)) { curJong = jamo; state = 4; }
                        else { flush(); curCho = jamo; state = 1; }
                    } break;
                case 4:
                    if (isV) {
                        let nextCho = curJong;
                        if (SPLIT_CC[curJong]) { result += combineHangul(curCho, curJung, SPLIT_CC[curJong][0]); nextCho = SPLIT_CC[curJong][1]; }
                        else { result += combineHangul(curCho, curJung); }
                        state = 3; curCho = nextCho; curJung = jamo; curJong = "";
                    } else {
                        if (COMPLEX_CONSONANTS[curJong + jamo]) curJong = COMPLEX_CONSONANTS[curJong + jamo];
                        else { flush(); curCho = jamo; state = 1; }
                    } break;
            }
        }
        flush(); return result;
    }

    function encodeJisKana(qwerty) {
        let result = '';
        for (let i = 0; i < qwerty.length; i++) {
            let char = qwerty[i];
            let kana = engToKanaMap[char] || char;
            
            if (kana === '゛') {
                let lastChar = result.slice(-1);
                let dkMap = {'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ','う':'ヴ'};
                if (dkMap[lastChar]) result = result.slice(0, -1) + dkMap[lastChar]; else result += kana;
            } else if (kana === '゜') {
                 let lastChar = result.slice(-1);
                 let hdkMap = {'は':'ぱ','ひ':'ぴ','ふ':'ぷ','へ':'ぺ','ほ':'ぽ'};
                 if (hdkMap[lastChar]) result = result.slice(0, -1) + hdkMap[lastChar]; else result += kana;
            } else {
                result += kana;
            }
        }
        return result;
    }

    // ==========================================
    // イベント処理
    // ==========================================
    const inputEl = document.getElementById('input');
    const qwertyEl = document.getElementById('qwerty');
    const outputEl = document.getElementById('output');
    const inTypeEl = document.getElementById('inputType');
    const outTypeEl = document.getElementById('outputType');

    function updateTranslation() {
        const text = inputEl.value;
        const inType = inTypeEl.value;
        const outType = outTypeEl.value;

        // 1. デコードしてQWERTYストロークを取得
        let qwerty = "";
        if (inType === 'romaji') qwerty = decodeRomaji(text);
        else if (inType === 'dubeol') qwerty = decodeDubeol(text);
        else if (inType === 'jiskana') qwerty = decodeJisKana(text);

        qwertyEl.value = qwerty;

        // 2. QWERTYストロークを指定のフォーマットにエンコード
        let outputText = "";
        if (outType === 'romaji') outputText = encodeRomaji(qwerty);
        else if (outType === 'dubeol') outputText = encodeDubeol(qwerty);
        else if (outType === 'jiskana') outputText = encodeJisKana(qwerty);

        outputEl.value = outputText;
    }

    inputEl.addEventListener('input', updateTranslation);
    inTypeEl.addEventListener('change', updateTranslation);
    outTypeEl.addEventListener('change', updateTranslation);

</script>

</body>
</html>
