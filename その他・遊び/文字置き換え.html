<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複数文字置き換えツール</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 1rem;
        }
        .rules-container {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .rule-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .rule-row input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .arrow {
            font-weight: bold;
            color: #666;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn-add {
            background: #17a2b8;
            color: #fff;
            margin-bottom: 10px;
        }
        .btn-add:hover { background: #138496; }
        .btn-remove {
            background: #dc3545;
            color: #fff;
            padding: 8px 12px;
        }
        .btn-remove:hover { background: #c82333; }
        .btn-convert {
            display: block;
            width: 100%;
            font-size: 1.2rem;
            padding: 15px;
            background: #007bff;
            color: #fff;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-convert:hover { background: #0056b3; }
        .btn-copy {
            background: #28a745;
            color: #fff;
            margin-top: 10px;
        }
        .btn-copy:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h1>複数文字置き換えツール</h1>

    <div class="form-group">
        <label for="input-text">変換するテキスト</label>
        <textarea id="input-text" placeholder="ここに元の文章を入力してください..."></textarea>
    </div>

    <div class="rules-container">
        <label>置換ルール設定</label>
        <div id="rules-wrapper">
            <!-- ルール入力欄がここに追加されます -->
        </div>
        <button id="add-rule-btn" class="btn-add" type="button">＋ 条件を追加</button>
    </div>

    <button id="convert-btn" class="btn-convert" type="button">一括変換する</button>

    <div class="form-group">
        <label for="output-text">変換結果</label>
        <textarea id="output-text" readonly placeholder="ここに結果が表示されます..."></textarea>
        <button id="copy-btn" class="btn-copy" type="button">結果をコピー</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const rulesWrapper = document.getElementById('rules-wrapper');
    const addRuleBtn = document.getElementById('add-rule-btn');
    const convertBtn = document.getElementById('convert-btn');
    const copyBtn = document.getElementById('copy-btn');
    const inputText = document.getElementById('input-text');
    const outputText = document.getElementById('output-text');

    // ルール入力欄を追加する関数
    function addRule() {
        const row = document.createElement('div');
        row.className = 'rule-row';
        row.innerHTML = `
            <input type="text" class="from-input" placeholder="置換前 (例: A)">
            <span class="arrow">→</span>
            <input type="text" class="to-input" placeholder="置換後 (例: B)">
            <button class="btn-remove" type="button">削除</button>
        `;
        
        // 削除ボタンの動作
        row.querySelector('.btn-remove').addEventListener('click', () => {
            row.remove();
        });

        rulesWrapper.appendChild(row);
    }

    // 最初から3つの入力欄を用意しておく
    addRule();
    addRule();
    addRule();

    // 追加ボタンを押したとき
    addRuleBtn.addEventListener('click', addRule);

    // 変換ボタンを押したとき
    convertBtn.addEventListener('click', () => {
        let text = inputText.value;
        const rows = document.querySelectorAll('.rule-row');
        
        // 上から順に置換処理を実行
        rows.forEach(row => {
            const fromStr = row.querySelector('.from-input').value;
            const toStr = row.querySelector('.to-input').value;
            
            if (fromStr !== '') {
                // すべての一致する文字を置換
                text = text.split(fromStr).join(toStr);
            }
        });
        
        outputText.value = text;
    });

    // コピーボタンを押したとき
    copyBtn.addEventListener('click', async () => {
        if (!outputText.value) return;
        try {
            await navigator.clipboard.writeText(outputText.value);
            alert('クリップボードにコピーしました！');
        } catch (err) {
            alert('コピーに失敗しました。');
        }
    });
});
</script>

</body>
</html>
