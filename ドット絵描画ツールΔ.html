<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Animator Pro v6</title>
    <!-- ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

    <style>
        :root {
            --bg-color: #2b2b2b;
            --panel-color: #3c3f41;
            --accent-color: #007acc;
            --text-color: #d4d4d4;
            --border-color: #555;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        /* Layout */
        header {
            background-color: var(--panel-color);
            padding: 5px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            height: 40px;
            flex-shrink: 0;
        }
        .main-area {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 180px);
        }
        .sidebar, .right-sidebar {
            width: 260px;
            background-color: var(--panel-color);
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow-y: auto;
            gap: 15px;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .right-sidebar {
            border-right: none;
            border-left: 1px solid var(--border-color);
        }
        
        .workspace {
            flex: 1;
            position: relative;
            background-color: #1e1e1e;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Checkerboard */
            background-image: 
                linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        
/* コンテナ：スクロールバーの管理とFlexboxによる配置 */
        #canvasContainer {
            overflow: auto;
            width: 100%;
            height: 100%;
            display: flex; /* 子要素のmargin:autoを効かせるために必要 */
            background-color: #1e1e1e;
            /* スクロールバーのデザイン（Chrome/Edge/Safari用） */
            scrollbar-width: thin;
            scrollbar-color: #555 #222;
        }

        /* キャンバス：margin: autoで「小さい時は中央、大きい時はスクロール」を実現 */
        #drawingCanvas {
            margin: auto; /* これが重要：中央寄せとスクロールの共存 */
            flex-shrink: 0; /* 画面が狭くても勝手に縮まないようにする */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            image-rendering: pixelated;
            cursor: crosshair;
            background: white;
            /* 透明部分の市松模様 */
            background-image: 
                linear-gradient(45deg, #ccc 25%, transparent 25%), 
                linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #ccc 75%), 
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 10px 10px;
            background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
        }

        /* UI Elements */
        h3 { margin: 0 0 10px 0; font-size: 12px; text-transform: uppercase; color: #aaa; border-bottom: 1px solid #555; padding-bottom: 5px; }
        button {
            background-color: #555; color: white; border: 1px solid #444;
            padding: 4px 8px; cursor: pointer; border-radius: 3px; font-size: 12px;
        }
        button:hover { background-color: #666; }
        button.active { background-color: var(--accent-color); border-color: #005c99; }
        
        input[type="number"] { background: #222; border: 1px solid #555; color: white; padding: 4px; width: 50px; }
        select { background: #222; border: 1px solid #555; color: white; padding: 4px; width: 100%; }

        .tool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .tool-btn { height: 32px; font-size: 16px; display: flex; align-items: center; justify-content: center; }

        #paletteContainer { display: flex; flex-wrap: wrap; gap: 2px; max-height: 100px; overflow-y: auto; }
/* .palette-swatch を以下に差し替え */
        .palette-swatch { 
            width: 18px; height: 18px; border: 1px solid #000; cursor: pointer; 
            position: relative;
            /* 透明部分がわかるように市松模様を背景に敷く */
            background-image: 
                linear-gradient(45deg, #ccc 25%, transparent 25%), 
                linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #ccc 75%), 
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 8px 8px;
            background-color: white;
        }
        /* 色自体はbox-shadow(inset)で描画して背景の模様をつぶさないようにするか、内部に描画 */
        .palette-swatch::after {
            content: ''; position: absolute; top:0; left:0; right:0; bottom:0;
            background-color: var(--swatch-color);
        }
        .palette-swatch.selected { border: 2px solid white; transform: scale(1.2); z-index: 2; }

        .layer-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; min-height: 100px; }
        .layer-item {
            background: #444; padding: 4px; cursor: pointer; display: flex; align-items: center; font-size: 12px;
            border-left: 3px solid transparent;
        }
        .layer-item.active { background: #555; border-left-color: var(--accent-color); }
        .layer-item .name { flex: 1; margin: 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .timeline-area {
            height: 140px;
            background: var(--panel-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .timeline-controls { padding: 5px 10px; border-bottom: 1px solid #555; display: flex; gap: 10px; align-items: center; }
        .frames-container {
            flex: 1; overflow-x: auto; display: flex; align-items: center; padding: 10px; gap: 8px; background: #333;
        }
        .frame-preview {
            width: 64px; height: 64px; background: #222; border: 1px solid #555;
            position: relative; cursor: pointer; flex-shrink: 0;
            display: flex; justify-content: center; align-items: center;
        }
        .frame-preview.active { border: 2px solid var(--accent-color); }
        .frame-preview canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; pointer-events: none; }
        .frame-num { position: absolute; bottom: 0; right: 0; background: rgba(0,0,0,0.7); font-size: 10px; padding: 1px 4px; color: #fff; }

        .zoom-controls { display: flex; align-items: center; gap: 5px; background: #222; padding: 2px 5px; border-radius: 4px; }

        /* Overlay for XML Request */
        #overlayBtn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 9999; padding: 20px 40px; font-size: 18px;
            background: var(--accent-color); color: white; border: 2px solid white;
            border-radius: 8px; cursor: pointer; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: none;
        }
    </style>
</head>
<body>

<!-- Overlay Button for Async Import -->
<button id="overlayBtn" onclick="app.triggerXmlSelect()">XMLファイルを選択してください<br><span style="font-size:12px">(クリックして選択)</span></button>

<header>
    <div style="display:flex; gap:10px; align-items:center;">
        <strong style="color:var(--accent-color)">DotAnimPro</strong>
        <div title="Canvas Size" style="font-size:12px">
            <input type="number" id="canvasWidth" value="32"> x 
            <input type="number" id="canvasHeight" value="32">
            <button onclick="app.resizeCanvasFromInput()">Resize</button>
        </div>
        <button onclick="app.newProject()">新規</button>
        <button onclick="app.saveToStorage()">保存</button>
        <button onclick="app.loadFromStorage()">読込</button>
    </div>
    
    <div class="zoom-controls">
        <span>Zoom:</span>
        <button onclick="app.setZoom(-1)">-</button>
        <span id="zoomLabel">100%</span>
        <button onclick="app.setZoom(1)">+</button>
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
        <button onclick="app.undo()">Undo (Z)</button>
        <button onclick="app.redo()">Redo (Y)</button>
    </div>
</header>

<div class="main-area">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <h3>Tools</h3>
        <div class="tool-grid">
            <button class="tool-btn active" onclick="app.setTool('pen')" title="Pen (P)">✏️</button>
            <button class="tool-btn" onclick="app.setTool('eraser')" title="Eraser (E)">🧼</button>
            <button class="tool-btn" onclick="app.setTool('bucket')" title="Fill (F)">🪣</button>
            <button class="tool-btn" onclick="app.setTool('picker')" title="Picker (I)">💉</button>
            <button class="tool-btn" onclick="app.setTool('line')" title="Line (L)">📏</button>
            <button class="tool-btn" onclick="app.setTool('rect')" title="Rect (R)">⬜</button>
            <button class="tool-btn" onclick="app.setTool('circle')" title="Circle (C)">⚪</button>
            <button class="tool-btn" onclick="app.setTool('move')" title="Move Layer (M)">✋</button>
            <!-- 選択コピー追加 -->
            <button class="tool-btn" onclick="app.setTool('select')" title="Select (S)">⬚</button>
        </div>
        <div style="margin-top:5px; display:flex; align-items:center; gap:5px;">
            <label>Size:</label>
            <input type="number" id="toolSize" value="1" min="1" max="50" style="flex:1">
        </div>

<!-- Colorsセクションを以下に差し替え -->
        <h3>Colors</h3>
        <div style="display:flex; gap:5px; margin-bottom:5px; align-items:center;">
            <!-- 色選択 -->
            <input type="color" id="colorPicker" value="#000000" onchange="app.setColorFromUI()" style="flex:1; height:25px;">
            <!-- 透明度スライダー (0.0 ~ 1.0) -->
            <input type="range" id="alphaSlider" min="0" max="1" step="0.01" value="1" style="width:50px;" title="Opacity" oninput="app.setColorFromUI()">
            <button onclick="app.addCurrentColor()">+</button>
        </div>
        <div id="paletteContainer"></div>
        <div style="margin-top:10px; border-top:1px solid #555; padding-top:5px;">
             <button onclick="document.getElementById('palLoader').click()" style="width:100%">画像からパレット抽出</button>
             <input type="file" id="palLoader" style="display:none" accept="image/*" onchange="app.loadPaletteFromImage(this)">
        </div>
    </div>

    <!-- Center Workspace -->
    <div class="workspace">
        <div id="canvasContainer">
            <canvas id="drawingCanvas"></canvas>
        </div>
        <!-- Hint text -->
        <div style="position:absolute; bottom:5px; left:5px; font-size:10px; color:#666; pointer-events:none;">
            Space + Drag: 画面移動 | CTRL + wheel: 拡大縮小
        </div>
    </div>

    <!-- Right Sidebar -->
    <div class="right-sidebar">
<!-- レイヤー順変更機能追加 -->
        <h3>Layers</h3>
        <div style="display:flex; gap:2px; margin-bottom:5px;">
            <button onclick="app.addLayer()" style="flex:1">+Add</button>
            <button onclick="app.deleteLayer()" title="Delete">Del</button>
            <button onclick="app.mergeDown()" title="Merge Down">▼</button>
            <button onclick="app.moveLayerUp()" title="Move Up">↑</button>
            <button onclick="app.moveLayerDown()" title="Move Down">↓</button>
        </div>

        <h3>Settings</h3>
        <label style="font-size:12px;"><input type="checkbox" id="onionSkin" onchange="app.renderCanvas()"> Onion Skin (透かし)</label>

        <h3>Import / Export</h3>
        
<!-- レイヤーとして画像を追加機能の追加 -->
        <div style="border:1px solid #555; padding:5px; margin-bottom:10px; background:#222;">
            <div style="font-size:11px; color:#aaa; margin-bottom:5px;">PROJECT / IMAGE / SHEET</div>
            <button onclick="document.getElementById('fileLoader').click()" style="width:100%; color:#fff; background:var(--accent-color); margin-bottom: 5px;">
                📂 開く (Open)
            </button>
            <button onclick="document.getElementById('layerImgLoader').click()" style="width:100%; color:#fff; background:#555;">
                🖼️ レイヤーとして画像追加
            </button>
            <!-- Main Import -->
            <input type="file" id="fileLoader" multiple style="display:none" onchange="app.handleFileImport(this)">
            <input type="file" id="layerImgLoader" accept="image/*" style="display:none" onchange="app.handleLayerImageImport(this)">
            <!-- XML Import (Second step) -->
            <input type="file" id="xmlLoader" accept=".xml" style="display:none" onchange="app.handleXmlImport(this)">
        </div>
        <!-- スプライトシートを任意の出力の仕方に -->
        <select id="exportFormat" style="margin-bottom:5px;" onchange="document.getElementById('sheetSettings').style.display = this.value === 'spritesheet' ? 'flex' : 'none'">
            <option value="png_single">現在フレーム (PNG)</option>
            <option value="zip_seq">連番画像 (ZIP)</option>
            <option value="spritesheet">SpriteSheet + XML</option>
            <option value="apng">APNG (アニメーション)</option>
            <option value="gif">GIF (アニメーション)</option>
        </select>
        
        <!-- スプライトシート用の行列設定（初期は非表示） -->
        <div id="sheetSettings" style="display:none; gap:5px; margin-bottom:5px; align-items:center;">
            <label style="font-size:12px;">横(列): <input type="number" id="sheetCols" value="4" min="1" style="width:40px;"></label>
            <label style="font-size:12px;">縦(行): <input type="number" id="sheetRows" value="4" min="1" style="width:40px;"></label>
        </div>

        <button onclick="app.exportProject()" style="width:100%">書き出し (Export)</button>
    </div>
</div>

<!-- Timeline -->
<div class="timeline-area">
    <div class="timeline-controls">
        <button onclick="app.togglePlay()" id="playBtn" style="width:60px">▶ Play</button>
        <label>FPS: <input type="number" id="fps" value="12" min="1" max="60"></label>
        <div style="width:1px; height:20px; background:#555; margin:0 5px;"></div>
        <button onclick="app.addFrame()">+ New</button>
        <button onclick="app.duplicateFrame()">Dup</button>
        <button onclick="app.deleteFrame()">Del</button>
    </div>
    <div class="frames-container" id="frameList"></div>
</div>

<script>
class PixelApp {
    // ------------------------------------------
    // アプリケーションの初期化
    // ------------------------------------------
    constructor() {
        this.width = 32;
        this.height = 32;
        this.frames = []; 
        this.currentFrameIndex = 0;
        this.currentLayerIndex = 0;
        
        this.tool = 'pen';
        this.color = 'rgba(0, 0, 0, 1)'; 
        this.palette = [
            'rgba(0,0,0,1)', 'rgba(255,255,255,1)', 'rgba(255,0,0,1)', 
            'rgba(0,255,0,1)', 'rgba(0,0,255,1)', 'rgba(255,255,0,1)'
        ];
        
        this.scale = 1.0;
        
        this.isDrawing = false;
        this.isPlaying = false;
        this.playTimer = null;
        this.history = [];
        this.historyIndex = -1;
        this.lastPos = {x:0, y:0};
        
        // パン操作用
        this.isSpaceDown = false;
        this.isPanning = false;

        // 【新規追加】画像コピペ用変数
        this.selection = null; // {x0, y0, x1, y1}
        this.clipboardCanvas = null;
        
        // インポート時の一時保存用
        this.pendingImportImg = null;

        // DOM要素の取得
        this.canvas = document.getElementById('drawingCanvas');
        this.container = document.getElementById('canvasContainer');
        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
        
        this.setupEvents();
        this.newProject();
    }

    // ------------------------------------------
    // 新規プロジェクトの作成
    // ------------------------------------------
    newProject() {
        this.frames = [];
        this.currentFrameIndex = 0;
        this.currentLayerIndex = 0;
        this.history = [];
        this.historyIndex = -1;
        this.addFrame(true); 
        this.updateCanvasDisplay();
        this.refreshPalette();
        this.saveHistory();
    }

    // ------------------------------------------
    // 入力欄からのキャンバスサイズ変更確認
    // ------------------------------------------
    resizeCanvasFromInput() {
        const w = parseInt(document.getElementById('canvasWidth').value) || 32;
        const h = parseInt(document.getElementById('canvasHeight').value) || 32;
        if(w !== this.width || h !== this.height) {
            if(confirm("サイズを変更しますか？（内容はクリッピングされます）")) {
                this.resizeProject(w, h);
            }
        }
    }

    // ------------------------------------------
    // 実際のキャンバスサイズ変更処理
    // ------------------------------------------
    resizeProject(w, h) {
        this.frames.forEach(f => {
            f.layers.forEach(l => {
                const newC = document.createElement('canvas');
                newC.width = w; newC.height = h;
                const nx = newC.getContext('2d');
                nx.drawImage(l.canvas, 0, 0);
                l.canvas = newC;
                l.ctx = nx;
            });
        });
        this.width = w;
        this.height = h;
        document.getElementById('canvasWidth').value = w;
        document.getElementById('canvasHeight').value = h;
        this.updateCanvasDisplay();
        this.saveHistory();
    }

    // ------------------------------------------
    // キャンバスの表示サイズ（ズーム）の更新
    // ------------------------------------------
    updateCanvasDisplay() {
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        
        const displayW = Math.floor(this.width * this.scale);
        const displayH = Math.floor(this.height * this.scale);
        
        this.canvas.style.width = displayW + "px";
        this.canvas.style.height = displayH + "px";
        
        this.renderCanvas();
        document.getElementById('zoomLabel').innerText = Math.round(this.scale * 100) + "%";
    }

    // ------------------------------------------
    // ズーム倍率の変更 (+ / -)
    // ------------------------------------------
    setZoom(dir) {
        const factor = 1.2;
        if (dir === 1) this.scale *= factor;
        else if (dir === -1) this.scale /= factor;
        
        if (this.scale < 0.01) this.scale = 0.01;
        if (this.scale > 100) this.scale = 100;
        
        this.updateCanvasDisplay();
    }

    // ------------------------------------------
    // マウス・キーボードイベントの設定
    // ------------------------------------------
    setupEvents() {
        const getPos = (e) => {
            const rect = this.canvas.getBoundingClientRect();
            return {
                x: Math.floor((e.clientX - rect.left) / this.scale),
                y: Math.floor((e.clientY - rect.top) / this.scale)
            };
        };

        /* キーボードイベント */
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' && !e.repeat) {
                this.isSpaceDown = true;
                this.canvas.style.cursor = 'grab';
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); this.undo(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); this.redo(); }
            
            // 【新規追加】コピペ用ショートカット
            if ((e.ctrlKey || e.metaKey) && e.key === 'c') { e.preventDefault(); this.copySelection(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'v') { e.preventDefault(); this.pasteClipboard(); }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'Space') {
                this.isSpaceDown = false;
                this.isPanning = false;
                this.canvas.style.cursor = 'crosshair';
            }
        });

        /* コンテナに対するマウスイベント (パン操作用) */
        this.container.addEventListener('mousedown', e => {
            if (this.isSpaceDown || e.button === 1) { 
                e.preventDefault();
                this.isPanning = true;
                this.canvas.style.cursor = 'grabbing';
                return;
            }
        });

        /* キャンバスに対するマウスイベント (描画・選択用) */
        this.canvas.addEventListener('mousedown', e => {
            if (this.isSpaceDown || e.button === 1) return;
            if (e.button !== 0) return;
            
            this.isDrawing = true;
            this.lastPos = getPos(e);
            
            if(this.tool === 'picker') { this.pickColor(this.lastPos.x, this.lastPos.y); this.isDrawing=false; return; }
            if(this.tool === 'bucket') { this.floodFill(this.lastPos.x, this.lastPos.y); this.isDrawing=false; this.saveHistory(); return; }
            
            // 【新規追加】選択ツールクリック時に以前の選択をリセット
            if (this.tool === 'select') {
                this.selection = null;
                this.renderCanvas();
            }

            if(this.tool === 'pen' || this.tool === 'eraser') {
                this.drawDot(this.getCurrentCtx(), this.lastPos.x, this.lastPos.y);
            }
            this.renderCanvas();
        });

        window.addEventListener('mousemove', e => {
            if (this.isPanning) {
                this.container.scrollLeft -= e.movementX;
                this.container.scrollTop -= e.movementY;
                return;
            }

            if (!this.isDrawing) return;
            const pos = getPos(e);
            
            if(this.tool === 'pen' || this.tool === 'eraser') {
                this.plotLine(this.getCurrentCtx(), this.lastPos.x, this.lastPos.y, pos.x, pos.y);
                this.lastPos = pos;
                this.renderCanvas();
            } 
            else if (['line','rect','circle','move','select'].includes(this.tool)) {
                this.renderCanvas(); 
                this.drawPreview(this.lastPos, pos);
            }
        });

        window.addEventListener('mouseup', e => {
            if (this.isPanning) {
                this.isPanning = false;
                this.canvas.style.cursor = this.isSpaceDown ? 'grab' : 'crosshair';
                return;
            }

            if(!this.isDrawing) return;
            this.isDrawing = false;
            const pos = getPos(e);
            
            if(['line','rect','circle'].includes(this.tool)) {
                const ctx = this.getCurrentCtx();
                if(this.tool === 'line') this.plotLine(ctx, this.lastPos.x, this.lastPos.y, pos.x, pos.y);
                else if(this.tool === 'rect') this.plotRect(ctx, this.lastPos.x, this.lastPos.y, pos.x, pos.y);
                else if(this.tool === 'circle') this.plotCircle(ctx, this.lastPos.x, this.lastPos.y, pos.x, pos.y);
            }
            else if(this.tool === 'move') {
                this.shiftLayer(pos.x - this.lastPos.x, pos.y - this.lastPos.y);
            }
            // 【新規追加】選択範囲の決定処理
            else if (this.tool === 'select') {
                this.selection = { x0: this.lastPos.x, y0: this.lastPos.y, x1: pos.x, y1: pos.y };
                this.renderCanvas();
                return; // 選択範囲を作るだけなので履歴保存はスキップ
            }
            
            this.saveHistory();
            this.renderCanvas();
        });
        
        /* CTRL + Scroll で拡大縮小 */
        this.container.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                this.setZoom(e.deltaY > 0 ? -1 : 1);
            }
        }, {passive:false});
    }

    // ------------------------------------------
    // 現在アクティブなレイヤーのContextを取得
    // ------------------------------------------
    getCurrentCtx() { 
        return this.frames[this.currentFrameIndex].layers[this.currentLayerIndex].ctx; 
    }

    // ------------------------------------------
    // ドットの描画・消去処理
    // ------------------------------------------
    drawDot(ctx, x, y) {
        const s = parseInt(document.getElementById('toolSize').value);
        const off = Math.floor(s/2);
        if(this.tool === 'eraser') {
            ctx.clearRect(x - off, y - off, s, s);
        } else {
            ctx.fillStyle = this.color;
            ctx.fillRect(x - off, y - off, s, s);
        }
    }

    // ------------------------------------------
    // 直線の描画アルゴリズム (Bresenham)
    // ------------------------------------------
    plotLine(ctx, x0, y0, x1, y1) {
        let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
        let sx = (x0 < x1) ? 1 : -1, sy = (y0 < y1) ? 1 : -1;
        let err = dx - dy;
        while(true) {
            this.drawDot(ctx, x0, y0);
            if (x0 === x1 && y0 === y1) break;
            let e2 = 2 * err;
            if (e2 > -dy) { err -= dy; x0 += sx; }
            if (e2 < dx) { err += dx; y0 += sy; }
        }
    }

    // ------------------------------------------
    // 四角形の描画
    // ------------------------------------------
    plotRect(ctx, x0, y0, x1, y1) {
        const xMin = Math.min(x0, x1), xMax = Math.max(x0, x1);
        const yMin = Math.min(y0, y1), yMax = Math.max(y0, y1);
        this.plotLine(ctx, xMin, yMin, xMax, yMin);
        this.plotLine(ctx, xMin, yMax, xMax, yMax);
        this.plotLine(ctx, xMin, yMin, xMin, yMax);
        this.plotLine(ctx, xMax, yMin, xMax, yMax);
    }

    // ------------------------------------------
    // 円の描画アルゴリズム (内包テストによる精密描画)
    // ------------------------------------------
    plotCircle(ctx, x0, y0, x1, y1) {
        const minX = Math.min(x0, x1), maxX = Math.max(x0, x1);
        const minY = Math.min(y0, y1), maxY = Math.max(y0, y1);
        const w = maxX - minX;
        const h = maxY - minY;
        
        if (w === 0 || h === 0) return;

        const cx = minX + w / 2;
        const cy = minY + h / 2;
        const rx = w / 2;
        const ry = h / 2;
        
        const s = parseInt(document.getElementById('toolSize').value);
        const innerRx = Math.max(0, rx - s);
        const innerRy = Math.max(0, ry - s);

        for (let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
            for (let x = Math.floor(minX); x <= Math.ceil(maxX); x++) {
                const px = x + 0.5;
                const py = y + 0.5;

                const distOuter = (Math.pow(px - cx, 2) / Math.pow(rx, 2)) + (Math.pow(py - cy, 2) / Math.pow(ry, 2));
                const distInner = (innerRx > 0 && innerRy > 0) 
                                ? (Math.pow(px - cx, 2) / Math.pow(innerRx, 2)) + (Math.pow(py - cy, 2) / Math.pow(innerRy, 2))
                                : 999; 

                if (distOuter <= 1.0 && distInner > 1.0) {
                     if(this.tool === 'eraser') ctx.clearRect(x, y, 1, 1);
                     else { ctx.fillStyle = this.color; ctx.fillRect(x, y, 1, 1); }
                }
            }
        }
    }

    // ------------------------------------------
    // 描画中のプレビュー（図形、選択枠、移動枠）
    // ------------------------------------------
    drawPreview(p1, p2) {
        const ctx = this.ctx; 
        
        // 【新規追加】選択ツールの点線枠描画
        if (this.tool === 'select') {
            ctx.strokeStyle = '#fff'; ctx.setLineDash([1, 1]); ctx.lineWidth = 1;
            const xMin = Math.min(p1.x, p2.x), yMin = Math.min(p1.y, p2.y);
            const w = Math.abs(p2.x - p1.x) + 1, h = Math.abs(p2.y - p1.y) + 1;
            ctx.strokeRect(xMin - 0.1, yMin - 0.1, w + 0.2, h + 0.2);
            ctx.setLineDash([]); // 点線リセット
            return;
        }

        ctx.fillStyle = this.color;
        
        if (this.tool === 'line') this.plotLine(ctx, p1.x, p1.y, p2.x, p2.y);
        else if (this.tool === 'rect') this.plotRect(ctx, p1.x, p1.y, p2.x, p2.y);
        else if (this.tool === 'circle') this.plotCircle(ctx, p1.x, p1.y, p2.x, p2.y);
        else if (this.tool === 'move') {
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            ctx.strokeRect(dx, dy, this.width, this.height);
        }
    }

    // ------------------------------------------
    // 塗りつぶしツール (RGBA対応)
    // ------------------------------------------
    floodFill(x, y) {
        const ctx = this.getCurrentCtx();
        const w=this.width, h=this.height;
        const img = ctx.getImageData(0,0,w,h);
        const d = img.data;
        const tIdx = (y*w+x)*4;
        
        const tr = d[tIdx], tg = d[tIdx+1], tb = d[tIdx+2], ta = d[tIdx+3];

        const dummy = document.createElement('div');
        dummy.style.color = this.color;
        document.body.appendChild(dummy);
        const computed = window.getComputedStyle(dummy).color; 
        document.body.removeChild(dummy);
        
        const match = computed.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d\.]+))?\)/);
        if(!match) return;
        
        const fr = parseInt(match[1]);
        const fg = parseInt(match[2]);
        const fb = parseInt(match[3]);
        const fa = Math.round((match[4]!==undefined ? parseFloat(match[4]) : 1) * 255);

        if(tr===fr && tg===fg && tb===fb && ta===fa) return;

        const stack=[tIdx];
        const matchColor = (i) => d[i]===tr && d[i+1]===tg && d[i+2]===tb && d[i+3]===ta;

        while(stack.length) {
            const i = stack.pop();
            if(matchColor(i)) {
                d[i]=fr; d[i+1]=fg; d[i+2]=fb; d[i+3]=fa;
                const px = (i/4)%w;
                if(px>0) stack.push(i-4);
                if(px<w-1) stack.push(i+4);
                if(i>=w*4) stack.push(i-w*4);
                if(i<d.length-w*4) stack.push(i+w*4);
            }
        }
        ctx.putImageData(img, 0, 0);
        this.renderCanvas();
    }

    // ------------------------------------------
    // スポイトツール (キャンバス上の見た目から色を取得)
    // ------------------------------------------
    pickColor(x, y) {
        const c = document.createElement('canvas'); c.width=this.width; c.height=this.height;
        const tx = c.getContext('2d');
        this.frames[this.currentFrameIndex].layers.forEach(l=>{if(l.visible) tx.drawImage(l.canvas,0,0)});
        
        const d = tx.getImageData(x,y,1,1).data;
        let alpha = parseFloat((d[3] / 255).toFixed(2));
        const rgba = `rgba(${d[0]}, ${d[1]}, ${d[2]}, ${alpha})`;
        
        this.setColor(rgba);
        this.setTool('pen');
    }

    // ------------------------------------------
    // レイヤー全体の移動処理
    // ------------------------------------------
    shiftLayer(dx, dy) {
        const ctx = this.getCurrentCtx();
        const d = ctx.getImageData(0,0,this.width,this.height);
        ctx.clearRect(0,0,this.width,this.height);
        ctx.putImageData(d, dx, dy);
    }

    // ------------------------------------------
    // 【新規追加】選択範囲をメモリにコピー
    // ------------------------------------------
    copySelection() {
        if (!this.selection) return;
        const x = Math.min(this.selection.x0, this.selection.x1);
        const y = Math.min(this.selection.y0, this.selection.y1);
        const w = Math.abs(this.selection.x1 - this.selection.x0) + 1;
        const h = Math.abs(this.selection.y1 - this.selection.y0) + 1;
        
        this.clipboardCanvas = document.createElement('canvas');
        this.clipboardCanvas.width = w;
        this.clipboardCanvas.height = h;
        const ctx = this.clipboardCanvas.getContext('2d');
        
        // 現在アクティブなレイヤーから選択範囲のみを切り抜いてコピー
        const currentLayerCanvas = this.frames[this.currentFrameIndex].layers[this.currentLayerIndex].canvas;
        ctx.drawImage(currentLayerCanvas, x, y, w, h, 0, 0, w, h);
    }

    // ------------------------------------------
    // 【新規追加】メモリの画像を新規レイヤーとしてペースト
    // ------------------------------------------
    pasteClipboard() {
        if (!this.clipboardCanvas) return;
        
        const frame = this.frames[this.currentFrameIndex];
        const newLayer = this.createLayer(`Pasted`);
        
        // 選択範囲が残っていればその位置に、無ければ(0,0)に貼り付ける
        const x = this.selection ? Math.min(this.selection.x0, this.selection.x1) : 0;
        const y = this.selection ? Math.min(this.selection.y0, this.selection.y1) : 0;
        
        newLayer.ctx.drawImage(this.clipboardCanvas, x, y);
        
        // 新規レイヤーとして現在レイヤーの上に挿入
        frame.layers.splice(this.currentLayerIndex + 1, 0, newLayer);
        this.currentLayerIndex++;
        
        // 選択を解除し、すぐ動かせるように移動ツールへ切り替え
        this.selection = null;
        this.setTool('move');
        
        this.updateUI();
        this.saveHistory();
    }

    // ------------------------------------------
    // キャンバス全体の再描画処理
    // ------------------------------------------
    renderCanvas() {
        this.ctx.clearRect(0, 0, this.width, this.height);
        
        // オニオンスキン(透かし)の描画
        if (document.getElementById('onionSkin').checked && this.currentFrameIndex > 0) {
            const prev = this.frames[this.currentFrameIndex - 1];
            this.ctx.save();
            this.ctx.globalAlpha = 0.3;
            prev.layers.forEach(l => { if(l.visible) this.ctx.drawImage(l.canvas, 0, 0); });
            this.ctx.restore();
        }
        
        // 現在のフレームのレイヤー群を描画
        const frame = this.frames[this.currentFrameIndex];
        frame.layers.forEach(l => {
            if (l.visible) this.ctx.drawImage(l.canvas, 0, 0);
        });
        
        // 【新規追加】選択ツール決定後の点線枠を描画し続ける
        if (this.selection) {
            this.ctx.save();
            this.ctx.strokeStyle = '#fff';
            this.ctx.setLineDash([1, 1]);
            this.ctx.lineWidth = 1;
            const xMin = Math.min(this.selection.x0, this.selection.x1);
            const yMin = Math.min(this.selection.y0, this.selection.y1);
            const w = Math.abs(this.selection.x1 - this.selection.x0) + 1;
            const h = Math.abs(this.selection.y1 - this.selection.y0) + 1;
            this.ctx.strokeRect(xMin - 0.1, yMin - 0.1, w + 0.2, h + 0.2);
            this.ctx.restore();
        }

        this.updateFramePreview(this.currentFrameIndex);
    }

    // ------------------------------------------
    // UI (レイヤーリストやタイムライン) の更新
    // ------------------------------------------
    updateUI() {
        const lList = document.getElementById('layerList');
        lList.innerHTML = '';
        const layers = this.frames[this.currentFrameIndex].layers;
        for (let i = layers.length - 1; i >= 0; i--) {
            const l = layers[i];
            const item = document.createElement('div');
            item.className = `layer-item ${i === this.currentLayerIndex ? 'active' : ''}`;
            item.onclick = () => { this.currentLayerIndex = i; this.updateUI(); };
            item.innerHTML = `
                <span style="cursor:pointer; margin-right:5px;" onclick="event.stopPropagation(); app.toggleVis(${i})">${l.visible ? '👁️' : '⚪'}</span>
                <span class="name">${l.name}</span>
            `;
            lList.appendChild(item);
        }

        const fList = document.getElementById('frameList');
        fList.innerHTML = '';
        this.frames.forEach((f, idx) => {
            const div = document.createElement('div');
            div.className = `frame-preview ${idx === this.currentFrameIndex ? 'active' : ''}`;
            div.onclick = () => {
                this.currentFrameIndex = idx;
                if(this.currentLayerIndex >= this.frames[idx].layers.length) this.currentLayerIndex = 0;
                this.updateUI();
            };
            const cvs = document.createElement('canvas');
            cvs.width = this.width; cvs.height = this.height;
            const cx = cvs.getContext('2d');
            f.layers.forEach(l => { if(l.visible) cx.drawImage(l.canvas, 0, 0); });
            div.appendChild(cvs);
            div.innerHTML += `<div class="frame-num">${idx+1}</div>`;
            fList.appendChild(div);
        });
        
        this.renderCanvas();
    }
    
    // ------------------------------------------
    // レイヤーの表示・非表示の切り替え
    // ------------------------------------------
    toggleVis(i) {
        this.frames[this.currentFrameIndex].layers[i].visible = !this.frames[this.currentFrameIndex].layers[i].visible;
        this.renderCanvas();
        this.updateUI();
    }

    // ------------------------------------------
    // タイムラインのフレームプレビュー画像の更新
    // ------------------------------------------
    updateFramePreview(idx) {
        const fList = document.getElementById('frameList');
        if(!fList.children[idx]) return;
        const cvs = fList.children[idx].querySelector('canvas');
        const cx = cvs.getContext('2d');
        cx.clearRect(0,0,this.width, this.height);
        this.frames[idx].layers.forEach(l => { if(l.visible) cx.drawImage(l.canvas, 0, 0); });
    }

    // ------------------------------------------
    // ツールの切り替え
    // ------------------------------------------
    setTool(t) {
        this.tool = t;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        const btns = document.querySelectorAll('.tool-btn');
        for(let b of btns) if(b.title.toLowerCase().includes(t)) b.classList.add('active');
    }

    // ------------------------------------------
    // カラーピッカーUIの変更を内部に反映
    // ------------------------------------------
    setColorFromUI() {
        const hex = document.getElementById('colorPicker').value;
        const alpha = document.getElementById('alphaSlider').value;
        const r = parseInt(hex.substring(1,3), 16);
        const g = parseInt(hex.substring(3,5), 16);
        const b = parseInt(hex.substring(5,7), 16);
        this.color = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        this.refreshPalette();
    }

    // ------------------------------------------
    // RGBA文字列を受け取り内部とUIを更新
    // ------------------------------------------
    setColor(rgbaStr) {
        this.color = rgbaStr;
        const match = rgbaStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d\.]+))?\)/);
        if(match) {
            const r = parseInt(match[1]), g = parseInt(match[2]), b = parseInt(match[3]);
            const a = match[4] !== undefined ? parseFloat(match[4]) : 1;
            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            document.getElementById('colorPicker').value = hex;
            document.getElementById('alphaSlider').value = a;
        }
    }

    // ------------------------------------------
    // パレットの再描画
    // ------------------------------------------
    refreshPalette() {
        const p = document.getElementById('paletteContainer'); p.innerHTML = '';
        this.palette.forEach(c => {
            const d = document.createElement('div');
            d.className = `palette-swatch ${c===this.color?'selected':''}`;
            d.style.setProperty('--swatch-color', c);
            d.title = c;
            d.onclick = () => { this.setColor(c); this.refreshPalette(); };
            p.appendChild(d);
        });
    }

    // ------------------------------------------
    // 現在の色をパレットに追加
    // ------------------------------------------
    addCurrentColor() { 
        if(!this.palette.includes(this.color)) { 
            this.palette.push(this.color); 
            this.refreshPalette(); 
        } 
    }

    // ==========================================
    // Import / Export
    // ==========================================
    
    // ------------------------------------------
    // 【新規追加】画像を新規レイヤーとして読み込む
    // ------------------------------------------
    handleLayerImageImport(input) {
        if(!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const frame = this.frames[this.currentFrameIndex];
                const newLayer = this.createLayer(`Imported Image`);
                
                // キャンバスサイズに合わせてリサイズして描画
                newLayer.ctx.drawImage(img, 0, 0, this.width, this.height);
                
                // 現在のレイヤーの上に挿入
                frame.layers.splice(this.currentLayerIndex + 1, 0, newLayer);
                this.currentLayerIndex++;
                
                this.updateUI();
                this.saveHistory();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
        input.value = ''; // Reset
    }

    // ------------------------------------------
    // プロジェクトや画像の読み込み窓口
    // ------------------------------------------
    handleFileImport(input) {
        if(input.files.length === 0) return;
        
        for(let f of input.files) {
            if(f.name.endsWith('.json')) {
                const r = new FileReader();
                r.onload = e => this.loadHistory(JSON.parse(e.target.result));
                r.readAsText(f);
                return;
            }
        }

        let imgFile = null;
        for(let f of input.files) if(f.type.startsWith('image/')) { imgFile = f; break; }
        
        if (imgFile) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    this.pendingImportImg = img;
                    if(confirm("これはスプライトシート（グリッド画像）ですか？")) {
                        if(confirm("XMLデータ（設定ファイル）はありますか？\n[OK] = XMLを選択して読み込む\n[Cancel] = コマ数を手動入力する")) {
                            document.getElementById('overlayBtn').style.display = 'block';
                        } else {
                            const cols = parseInt(prompt("横のコマ数(Columns):", 1)) || 1;
                            const rows = parseInt(prompt("縦のコマ数(Rows):", 1)) || 1;
                            this.importSpriteSheetGrid(img, cols, rows);
                        }
                    } else {
                        this.importSingleImage(img);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(imgFile);
        }
    }

    triggerXmlSelect() {
        document.getElementById('overlayBtn').style.display = 'none';
        document.getElementById('xmlLoader').click();
    }

    handleXmlImport(input) {
        if(!input.files[0] || !this.pendingImportImg) return;
        const reader = new FileReader();
        reader.onload = e => {
            this.importSpriteSheetXML(this.pendingImportImg, e.target.result);
            this.pendingImportImg = null;
            input.value = '';
        };
        reader.readAsText(input.files[0]);
    }

    importSingleImage(img) {
        this.width = img.width; this.height = img.height;
        document.getElementById('canvasWidth').value = this.width;
        document.getElementById('canvasHeight').value = this.height;
        this.frames = []; this.currentFrameIndex = 0;
        const l = this.createLayer('Imported'); l.ctx.drawImage(img, 0, 0);
        this.frames.push({layers: [l]});
        this.updateCanvasDisplay(); this.updateUI(); this.saveHistory();
    }

    importSpriteSheetGrid(img, cols, rows) {
        const fw = Math.floor(img.width / cols);
        const fh = Math.floor(img.height / rows);
        this.width = fw; this.height = fh;
        document.getElementById('canvasWidth').value = fw;
        document.getElementById('canvasHeight').value = fh;
        this.frames = [];
        for(let y=0; y<rows; y++) {
            for(let x=0; x<cols; x++) {
                const l = this.createLayer(`F${this.frames.length+1}`);
                l.ctx.drawImage(img, x*fw, y*fh, fw, fh, 0, 0, fw, fh);
                this.frames.push({layers: [l]});
            }
        }
        this.currentFrameIndex = 0;
        this.updateCanvasDisplay(); this.updateUI(); this.saveHistory();
    }

    importSpriteSheetXML(img, xmlStr) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlStr, "text/xml");
        const sub = xmlDoc.getElementsByTagName("SubTexture");
        if(sub.length === 0) { alert("Invalid XML"); return; }
        const f1 = sub[0];
        this.width = parseInt(f1.getAttribute("width"));
        this.height = parseInt(f1.getAttribute("height"));
        document.getElementById('canvasWidth').value = this.width;
        document.getElementById('canvasHeight').value = this.height;
        this.frames = [];
        for(let i=0; i<sub.length; i++) {
            const st = sub[i];
            const sx = parseInt(st.getAttribute("x")), sy = parseInt(st.getAttribute("y"));
            const sw = parseInt(st.getAttribute("width")), sh = parseInt(st.getAttribute("height"));
            const l = this.createLayer(st.getAttribute("name") || `F${i}`);
            l.ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
            this.frames.push({layers:[l]});
        }
        this.currentFrameIndex = 0;
        this.updateCanvasDisplay(); this.updateUI(); this.saveHistory();
    }

    // ------------------------------------------
    // 画像からパレット色を抽出
    // ------------------------------------------
    loadPaletteFromImage(input) {
        if(!input.files[0]) return;
        const r = new FileReader();
        r.onload = e => {
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
                const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
                const d = ctx.getImageData(0,0,c.width,c.height).data;
                const counts = {};
                for(let i=0; i<d.length; i+=4) {
                    if(d[i+3] === 0) continue; 
                    const alpha = parseFloat((d[i+3]/255).toFixed(2));
                    const rgba = `rgba(${d[i]},${d[i+1]},${d[i+2]},${alpha})`;
                    counts[rgba] = (counts[rgba]||0)+1;
                }
                const sorted = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
                if(sorted.length) { this.palette = sorted.slice(0, 256); this.refreshPalette(); }
            };
            img.src = e.target.result;
        };
        r.readAsDataURL(input.files[0]);
    }

    // ------------------------------------------
    // 履歴 (Undo/Redo) の保存と復元
    // ------------------------------------------
    saveHistory() {
        if(this.historyIndex < this.history.length-1) this.history = this.history.slice(0, this.historyIndex+1);
        const st = {
            width: this.width, height: this.height, currentFrame: this.currentFrameIndex,
            frames: this.frames.map(f => ({
                layers: f.layers.map(l => ({ name:l.name, visible:l.visible, data:l.canvas.toDataURL() }))
            }))
        };
        this.history.push(st);
        if(this.history.length>20) this.history.shift();
        this.historyIndex = this.history.length-1;
    }
    undo() { if(this.historyIndex>0) { this.historyIndex--; this.loadHistory(this.history[this.historyIndex]); } }
    redo() { if(this.historyIndex<this.history.length-1) { this.historyIndex++; this.loadHistory(this.history[this.historyIndex]); } }
    
    loadHistory(st) {
        this.width = st.width; this.height = st.height; this.currentFrameIndex = st.currentFrame;
        document.getElementById('canvasWidth').value = this.width;
        document.getElementById('canvasHeight').value = this.height;
        this.frames = st.frames.map(sf => {
            const layers = sf.layers.map(sl => {
                const l = this.createLayer(sl.name); l.visible = sl.visible;
                const i = new Image(); i.onload = () => { l.ctx.drawImage(i,0,0); this.renderCanvas(); };
                i.src = sl.data;
                return l;
            });
            return {layers:layers};
        });
        this.updateCanvasDisplay();
        this.updateUI();
    }

    // ------------------------------------------
    // プロジェクトの保存と読み込み (ローカルストレージ)
    // ------------------------------------------
    saveToStorage() { try { localStorage.setItem('pixelArtPro', JSON.stringify(this.history[this.historyIndex])); alert('保存しました'); } catch(e){ alert('容量オーバーです'); } }
    loadFromStorage() { const d=localStorage.getItem('pixelArtPro'); if(d) this.loadHistory(JSON.parse(d)); }

    // ------------------------------------------
    // アニメーションの再生・停止
    // ------------------------------------------
    togglePlay() {
        if(this.isPlaying) { clearInterval(this.playTimer); this.isPlaying=false; document.getElementById('playBtn').innerText="▶ Play"; }
        else {
            this.isPlaying=true; document.getElementById('playBtn').innerText="⏹ Stop";
            this.playTimer = setInterval(() => {
                this.currentFrameIndex = (this.currentFrameIndex+1)%this.frames.length;
                this.updateUI();
            }, 1000/parseInt(document.getElementById('fps').value));
        }
    }
    
    // ------------------------------------------
    // 作品の各種フォーマット書き出し処理
    // ------------------------------------------
    async exportProject() {
        const fmt = document.getElementById('exportFormat').value;
        const fps = parseInt(document.getElementById('fps').value);
        
        const renders = this.frames.map(f => {
            const c = document.createElement('canvas'); 
            c.width = this.width; 
            c.height = this.height;
            const x = c.getContext('2d'); 
            f.layers.forEach(l => { if(l.visible) x.drawImage(l.canvas, 0, 0); });
            return c;
        });

        const uniqueColors = new Set();
        renders.forEach(c => {
            const ctx = c.getContext('2d');
            const imgData = ctx.getImageData(0, 0, this.width, this.height).data;
            for (let i = 0; i < imgData.length; i += 4) {
                const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2], a = imgData[i + 3];
                if (a === 0) uniqueColors.add("0,0,0,0");
                else uniqueColors.add(`${r},${g},${b},${a}`);
            }
        });

        const colorCount = uniqueColors.size;
        let cnum = 0;
        if (colorCount <= 2) cnum = 2;
        else if (colorCount <= 4) cnum = 4;
        else if (colorCount <= 16) cnum = 16;
        else if (colorCount <= 256) cnum = 256;
        else cnum = 0; 
        
        if (fmt === 'png_single') {
            const ctx = renders[this.currentFrameIndex].getContext('2d');
            const buffer = ctx.getImageData(0, 0, this.width, this.height).data.buffer;
            const pngBuffer = UPNG.encode([buffer], this.width, this.height, cnum);
            saveAs(new Blob([pngBuffer], { type: "image/png" }), 'image.png');
        }
        else if (fmt === 'zip_seq') {
            const z = new JSZip();
            renders.forEach((c, i) => z.file(`frame_${i}.png`, c.toDataURL().split(',')[1], {base64: true}));
            z.generateAsync({type: 'blob'}).then(b => saveAs(b, 'frames.zip'));
        }
        else if (fmt === 'spritesheet') {
            const cols = parseInt(document.getElementById('sheetCols').value) || 1;
            const rows = parseInt(document.getElementById('sheetRows').value) || 1;
            
            if (cols * rows < renders.length) {
                alert(`マスの数が足りません！\nアニメーションのコマ数: ${renders.length}コマ\n指定されたマス数: ${cols * rows}マス (横${cols} × 縦${rows})`);
                return;
            }

            const sheet = document.createElement('canvas'); 
            sheet.width = cols * this.width; 
            sheet.height = rows * this.height;
            const sx = sheet.getContext('2d');
            
            let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<TextureAtlas imagePath="sheet.png">\n';
            renders.forEach((c, i) => {
                const x = (i % cols) * this.width, y = Math.floor(i / cols) * this.height;
                sx.drawImage(c, x, y);
                xml += `\t<SubTexture name="frame_${i}" x="${x}" y="${y}" width="${this.width}" height="${this.height}"/>\n`;
            });
            xml += '</TextureAtlas>';
            
            const sheetBuffer = sx.getImageData(0, 0, sheet.width, sheet.height).data.buffer;
            const pngBuffer = UPNG.encode([sheetBuffer], sheet.width, sheet.height, cnum);
            
            saveAs(new Blob([pngBuffer], {type: 'image/png'}), 'sheet.png');
            saveAs(new Blob([xml], {type: 'text/xml'}), 'sheet.xml');
        }
        else if (fmt === 'apng') {
            const buffs = renders.map(c => c.getContext('2d').getImageData(0, 0, this.width, this.height).data.buffer);
            const d = new Array(buffs.length).fill(1000 / fps);
            saveAs(new Blob([UPNG.encode(buffs, this.width, this.height, cnum, d)], {type: "image/png"}), "anim.png");
        }
        else if (fmt === 'gif') {
            const wBlob = new Blob([`importScripts('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');`], {type: 'text/javascript'});
            const gif = new GIF({
                workers: 2, quality: 1, width: this.width, height: this.height, 
                workerScript: URL.createObjectURL(wBlob), transparent: 0x000000
            });
            renders.forEach(c => gif.addFrame(c, {delay: 1000 / fps}));
            gif.on('finished', b => saveAs(b, 'anim.gif'));
            gif.render();
        }
    }

    // ------------------------------------------
    // 新規レイヤーのキャンバス要素を作成
    // ------------------------------------------
    createLayer(name) {
        const c = document.createElement('canvas'); c.width=this.width; c.height=this.height;
        return { name: name, visible: true, canvas: c, ctx: c.getContext('2d', { willReadFrequently: true }) };
    }

    // ------------------------------------------
    // フレームの追加・複製・削除
    // ------------------------------------------
    addFrame(isFirst=false) {
        const layers = [this.createLayer('Layer 1')];
        this.frames.splice(this.currentFrameIndex + 1, 0, { layers: layers });
        if (!isFirst) this.currentFrameIndex++;
        this.currentLayerIndex = 0;
        this.updateUI();
        if(!isFirst) this.saveHistory();
    }
    duplicateFrame() {
        const src = this.frames[this.currentFrameIndex];
        const newLayers = src.layers.map(l => {
            const nl = this.createLayer(l.name);
            nl.ctx.drawImage(l.canvas, 0, 0);
            nl.visible = l.visible;
            return nl;
        });
        this.frames.splice(this.currentFrameIndex + 1, 0, { layers: newLayers });
        this.currentFrameIndex++;
        this.updateUI();
        this.saveHistory();
    }
    deleteFrame() {
        if (this.frames.length <= 1) return;
        this.frames.splice(this.currentFrameIndex, 1);
        if (this.currentFrameIndex >= this.frames.length) this.currentFrameIndex = this.frames.length - 1;
        this.updateUI();
        this.saveHistory();
    }

    // ------------------------------------------
    // レイヤーの追加・削除・結合
    // ------------------------------------------
    addLayer() {
        const frame = this.frames[this.currentFrameIndex];
        frame.layers.splice(this.currentLayerIndex + 1, 0, this.createLayer(`Layer ${frame.layers.length + 1}`));
        this.currentLayerIndex++;
        this.updateUI();
        this.saveHistory();
    }
    deleteLayer() {
        const frame = this.frames[this.currentFrameIndex];
        if (frame.layers.length <= 1) return;
        frame.layers.splice(this.currentLayerIndex, 1);
        if (this.currentLayerIndex >= frame.layers.length) this.currentLayerIndex = frame.layers.length - 1;
        this.updateUI();
        this.saveHistory();
    }
    mergeDown() {
        if (this.currentLayerIndex === 0) return;
        const frame = this.frames[this.currentFrameIndex];
        const top = frame.layers[this.currentLayerIndex];
        const bot = frame.layers[this.currentLayerIndex - 1];
        bot.ctx.drawImage(top.canvas, 0, 0);
        frame.layers.splice(this.currentLayerIndex, 1);
        this.currentLayerIndex--;
        this.updateUI();
        this.saveHistory();
    }

    // ------------------------------------------
    // 【新規追加】レイヤーの順番入れ替え (↑/↓)
    // ------------------------------------------
    moveLayerUp() {
        const frame = this.frames[this.currentFrameIndex];
        if (this.currentLayerIndex >= frame.layers.length - 1) return;
        const tmp = frame.layers[this.currentLayerIndex];
        frame.layers[this.currentLayerIndex] = frame.layers[this.currentLayerIndex + 1];
        frame.layers[this.currentLayerIndex + 1] = tmp;
        this.currentLayerIndex++;
        this.updateUI();
        this.saveHistory();
    }
    
    moveLayerDown() {
        const frame = this.frames[this.currentFrameIndex];
        if (this.currentLayerIndex <= 0) return;
        const tmp = frame.layers[this.currentLayerIndex];
        frame.layers[this.currentLayerIndex] = frame.layers[this.currentLayerIndex - 1];
        frame.layers[this.currentLayerIndex - 1] = tmp;
        this.currentLayerIndex--;
        this.updateUI();
        this.saveHistory();
    }
}

const app = new PixelApp();
