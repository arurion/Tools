<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixel Art Animator Pro</title>
    
    <!-- 外部ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

    <style>
        :root {
            --bg-base: #E8F2FA;
            --workspace-bg: #DCE7F2;
            --glass-header: rgba(242, 248, 254, 0.88);
            --glass-sidebar: rgba(238, 246, 253, 0.85);
            --glass-card: rgba(255, 255, 255, 0.60);
            --glass-card-hover: rgba(255, 255, 255, 0.88);
            
            --border-subtle: rgba(100, 116, 139, 0.18);
            --border-highlight: rgba(255, 255, 255, 0.90);
            --shadow-glass: 0 4px 16px rgba(15, 23, 42, 0.04);
            --shadow-float: 0 10px 28px rgba(15, 23, 42, 0.10);
            --shadow-inset: inset 0 1px 1px rgba(255, 255, 255, 0.85);
            
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-tertiary: #94A3B8;
            
            --accent-color: #2563EB;
            --accent-hover: #3B82F6;
            --accent-active: #1D4ED8;
            --accent-tint: rgba(37, 99, 235, 0.10);
            --accent-glow: rgba(37, 99, 235, 0.25);

            --danger: #DC2626;

            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 10px;

            --header-h: 42px;
            --timeline-h: 118px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            min-width: 0;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
        }

        /* SVG Icon Base */
        .icon {
            width: 15px;
            height: 15px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .icon-lg { width: 17px; height: 17px; }
        .icon-sm { width: 13px; height: 13px; }

        /* Top Header */
        header {
            height: var(--header-h);
            background: var(--glass-header);
            backdrop-filter: blur(12px) saturate(135%);
            -webkit-backdrop-filter: blur(12px) saturate(135%);
            box-shadow: var(--shadow-inset), 0 2px 8px rgba(15, 23, 42, 0.03);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            z-index: 40;
            flex-shrink: 0;
            gap: 4px;
            width: 100%;
            overflow: hidden;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: var(--radius-sm);
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
            max-width: 130px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 3px;
            overflow-x: hidden;
            flex-shrink: 1;
            justify-content: flex-end;
        }

        /* Glass Buttons */
        button, .btn {
            appearance: none;
            background: var(--glass-card);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-inset);
            padding: 4px 6px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            white-space: nowrap;
            height: 28px;
            flex-shrink: 0;
        }

        button:hover, .btn:hover {
            background: var(--glass-card-hover);
            border-color: rgba(100, 116, 139, 0.3);
        }

        button:active, .btn:active {
            box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.08);
        }

        button.btn-primary {
            background: var(--accent-color);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 8px var(--accent-glow);
        }
        button.btn-primary:hover { background: var(--accent-hover); }

        button.active {
            background: var(--accent-tint);
            border-color: var(--accent-color);
            color: var(--accent-color);
            font-weight: 600;
            box-shadow: inset 0 0 0 1px var(--accent-color);
        }

        input[type="number"], select, input[type="text"] {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 3px 4px;
            font-size: 11px;
            height: 28px;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
            outline: none;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            background: rgba(148, 163, 184, 0.28);
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--accent-color);
            border: 2px solid #ffffff;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
            cursor: pointer;
        }

        /* Layout */
        .main-layout {
            display: flex;
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .sidebar-left, .sidebar-right {
            width: 230px;
            background: var(--glass-sidebar);
            backdrop-filter: blur(14px) saturate(130%);
            -webkit-backdrop-filter: blur(14px) saturate(130%);
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 10px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 20;
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar-left {
            border-right: 1px solid var(--border-subtle);
            box-shadow: 4px 0 16px rgba(15, 23, 42, 0.02);
        }
        .sidebar-right {
            border-left: 1px solid var(--border-subtle);
            box-shadow: -4px 0 16px rgba(15, 23, 42, 0.02);
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            margin: 0 0 5px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .row-group { display: flex; flex-direction: column; gap: 5px; }
        .inline-row { display: flex; align-items: center; gap: 4px; }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
        }
        .tool-btn { height: 32px; padding: 0; }

        /* Workspace & Canvas Viewport */
        .workspace-viewport {
            flex: 1;
            min-width: 0;
            min-height: 0;
            position: relative;
            background: radial-gradient(circle at center, #EAF2FA 0%, var(--workspace-bg) 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            width: 100%;
        }

        #canvasTransformLayer {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            pointer-events: none;
        }

        #canvasArtboard {
            position: relative;
            box-shadow: 0 0 0 1px rgba(71, 85, 105, 0.35), 0 10px 32px rgba(15, 23, 42, 0.14);
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            pointer-events: auto;
        }

        #drawingCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            display: block;
        }

        #selectionOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            image-rendering: pixelated;
        }

        /* Selection Floating Context Bar */
        .selection-floating-bar {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3px 5px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-highlight);
            box-shadow: var(--shadow-float);
            display: none;
            align-items: center;
            gap: 3px;
            z-index: 35;
            max-width: calc(100% - 10px);
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Bottom Floating Bar */
        .floating-quick-bar {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2px 6px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 10;
            max-width: calc(100% - 16px);
            overflow: hidden;
        }

        .fullscreen-btn-pill {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 50;
            display: none;
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3px 8px;
            box-shadow: var(--shadow-float);
        }

        /* 復元: セキュリティポリシー対策オーバーレイボタン */
        #overlayBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-highlight);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.25);
            border-radius: var(--radius-lg);
            padding: 16px 24px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-align: center;
            color: var(--text-primary);
        }
        #overlayBtn:hover {
            background: #ffffff;
            box-shadow: 0 20px 48px rgba(15, 23, 42, 0.3);
        }

        /* コピー通知トースト */
        #copyToast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            box-shadow: var(--shadow-float);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        #copyToast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Colors & Swatches */
        .color-row { display: flex; align-items: center; gap: 4px; }
        .color-preview-wrap {
            position: relative;
            width: 26px; height: 26px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            flex-shrink: 0;
            background: #fff;
        }
        #colorPicker {
            position: absolute;
            top: -10px; left: -10px;
            width: 46px; height: 46px;
            cursor: pointer;
            border: none;
            background: transparent;
        }
        .color-preview-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
        }
        #paletteContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            max-height: 100px;
            overflow-y: auto;
            padding: 3px;
            background: rgba(255, 255, 255, 0.45);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
        }
        .palette-swatch {
            width: 16px; height: 16px;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            border: 1px solid rgba(0,0,0,0.15);
            background-color: #fff;
        }
        .palette-swatch::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 1px;
            background-color: var(--swatch-color);
        }
        .palette-swatch.selected {
            box-shadow: 0 0 0 2px var(--accent-color);
            transform: scale(1.12);
            z-index: 2;
        }

        /* Layers & Timeline */
        .layer-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 70px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: var(--radius-sm);
            padding: 2px;
            border: 1px solid var(--border-subtle);
        }
        .layer-item {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid transparent;
            padding: 3px 5px;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 11px;
            transition: all 0.12s ease;
        }
        .layer-item.active {
            background: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 1px 4px rgba(37, 99, 235, 0.10);
            font-weight: 600;
        }
        .layer-item .name { flex: 1; margin: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .timeline-area {
            height: var(--timeline-h);
            background: var(--glass-sidebar);
            backdrop-filter: blur(14px) saturate(130%);
            -webkit-backdrop-filter: blur(14px) saturate(130%);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 30;
            transition: height 0.2s ease;
            width: 100%;
        }
        .timeline-area.collapsed { height: 26px; }
        .timeline-controls {
            padding: 2px 6px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            height: 26px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .frames-container {
            flex: 1;
            overflow-x: auto;
            display: flex;
            align-items: center;
            padding: 4px 6px;
            gap: 5px;
            scrollbar-width: thin;
        }
        .timeline-area.collapsed .frames-container { display: none; }
        .frame-preview {
            width: 44px; height: 44px;
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-glass);
        }
        .frame-preview.active {
            border: 2px solid var(--accent-color);
            box-shadow: 0 2px 8px var(--accent-glow);
        }
        .frame-preview canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; pointer-events: none; }
        .frame-num {
            position: absolute; bottom: 1px; right: 1px;
            background: rgba(15, 23, 42, 0.75); font-size: 8px; padding: 1px 3px; color: #fff; border-radius: 2px;
        }

        /* 9-Anchor Grid for Resize */
        .anchor-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            width: 100px;
            margin: 0 auto;
        }
        .anchor-btn {
            width: 30px; height: 30px; padding: 0; font-size: 11px;
        }
        .anchor-btn.selected {
            background: var(--accent-color); color: #fff; border-color: var(--accent-color);
        }

        /* Modals & Backdrop */
        .drawer-backdrop {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.25);
            backdrop-filter: blur(2px);
            z-index: 15;
        }
        .drawer-backdrop.active { display: block; }

        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        .modal-window {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-highlight);
            box-shadow: var(--shadow-float);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 92vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 5px;
        }
        .modal-title { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 6px;
            max-height: 340px;
            overflow-y: auto;
            padding: 2px;
        }
        .project-card {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            box-shadow: var(--shadow-glass);
        }
        .project-card.active { border: 2px solid var(--accent-color); }
        .project-thumb {
            width: 100%;
            aspect-ratio: 1;
            background: #f1f5f9;
            border-radius: 3px;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .project-name { font-size: 10px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .project-meta { font-size: 8px; color: var(--text-tertiary); }

        /* Fullscreen Mode */
        body.mode-fullscreen header,
        body.mode-fullscreen .timeline-area,
        body.mode-fullscreen .sidebar-left,
        body.mode-fullscreen .sidebar-right {
            display: none !important;
        }
        body.mode-fullscreen .fullscreen-btn-pill { display: inline-flex; }

        .mobile-btn { display: none; }

        /* ---------------------------------------------------- */
        /* Responsive Breakpoints & Ultra-Narrow Degradation     */
        /* ---------------------------------------------------- */

        @media (max-width: 860px) {
            .mobile-btn { display: inline-flex; }
            .desktop-label { display: none; }
            .sidebar-left, .sidebar-right {
                position: absolute;
                top: 0; bottom: 0;
                width: 240px;
                max-width: 85vw;
                box-shadow: var(--shadow-float);
                background: rgba(248, 251, 255, 0.98);
            }
            .sidebar-left { left: 0; transform: translateX(-105%); }
            .sidebar-left.open { transform: translateX(0); }
            .sidebar-right { right: 0; transform: translateX(105%); }
            .sidebar-right.open { transform: translateX(0); }
        }

        @media (max-width: 380px) {
            header { padding: 0 4px; gap: 2px; }
            .brand-title { max-width: 75px; font-size: 10px; }
            button, .btn { padding: 2px 4px; font-size: 9px; height: 24px; }
            .hide-on-compact { display: none !important; }
        }

        @media (max-width: 140px) {
            :root {
                --header-h: 30px;
                --timeline-h: 26px;
            }
            header { padding: 0 2px; gap: 2px; }
            .brand-title { display: none !important; }
            button, .btn { padding: 0; width: 22px; height: 22px; }
            .hide-on-ultranarrow { display: none !important; }

            .sidebar-left, .sidebar-right {
                width: 100vw !important;
                max-width: 100vw !important;
                padding: 6px;
                gap: 6px;
            }
            .tool-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            .floating-quick-bar {
                bottom: 4px;
                left: 4px;
                right: 4px;
                width: calc(100% - 8px);
                padding: 1px 3px;
                gap: 2px;
            }
            .floating-quick-bar input[type="range"], .floating-quick-bar input[type="number"] {
                width: 100%;
                min-width: 18px;
            }
            #toolSizeLabel, #zoomLabel, .quick-zoom-btn, #btnResetSize {
                display: none;
            }

            .timeline-area {
                height: 26px !important;
            }
            .timeline-controls {
                padding: 2px;
                justify-content: space-around;
            }
            .timeline-controls button {
                width: 22px !important;
                height: 22px !important;
            }
            #fpsContainer, .timeline-controls .inline-row:last-child button:not(#timelineCollapseBtn) {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<!-- Backdrop for Drawers -->
<div class="drawer-backdrop" id="drawerBackdrop" onclick="app.closeDrawers()"></div>

<!-- Fullscreen Exit Pill -->
<button class="fullscreen-btn-pill" onclick="app.toggleFullscreenMode()" title="通常表示に戻す">
    <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
    <span style="font-size:9px; font-weight:600; margin-left:2px;">復帰</span>
</button>

<!-- 復元: セキュリティポリシー対策オーバーレイボタン -->
<button id="overlayBtn" onclick="app.triggerXmlSelect()">
    <svg class="icon icon-lg" viewBox="0 0 24 24" style="color:var(--accent-color);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    <span style="font-size:13px; font-weight:700;">XML設定ファイルを選択</span>
    <span style="font-size:10px; color:var(--text-secondary);">クリックして選択ダイアログを開きます</span>
</button>

<!-- コピー通知トースト -->
<div id="copyToast">選択範囲をコピーしました</div>

<!-- Header -->
<header>
    <div class="brand-area">
        <button class="mobile-btn" onclick="app.toggleSidebar('left')" title="ツールメニュー">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/></svg>
        </button>
        <span class="brand-title" onclick="app.openGalleryModal()" title="作品ギャラリー切り替え">
            <svg class="icon" viewBox="0 0 24 24" style="color:var(--accent-color);"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span id="headerProjectName">DotAnimPro</span>
        </span>
    </div>

    <div class="header-actions">
        <button class="hide-on-ultranarrow" onclick="app.togglePenEraser()" title="ペン/消しゴム切り替え (X)">
            <svg class="icon" viewBox="0 0 24 24"><path d="m18 2 4 4-12 12H6v-4L18 2Z"/><path d="m2 22 5-1-4-4-1 5Z"/></svg>
        </button>
        <button onclick="app.undo()" title="元に戻す (Ctrl+Z / 2本指タップ)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <button onclick="app.redo()" title="やり直す (Ctrl+Y / 3本指タップ)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
        </button>
        <button class="hide-on-compact hide-on-ultranarrow" onclick="app.openResizeModal()" title="キャンバスサイズ変更">
            <svg class="icon" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
            <span class="desktop-label">サイズ</span>
        </button>
        <button class="hide-on-compact hide-on-ultranarrow" onclick="app.exportCurrentProjectSingle()" title="この作品を単体保存 (JSON)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span class="desktop-label">保存</span>
        </button>
        <button class="btn-primary" onclick="document.getElementById('exportModal').style.display='flex'" title="画像書き出し">
            <svg class="icon" viewBox="0 0 24 24" style="color:#fff;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span class="desktop-label">出力</span>
        </button>
        <button class="mobile-btn" onclick="app.toggleSidebar('right')" title="レイヤーメニュー">
            <svg class="icon" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 12.5-8.58 3.91a2 2 0 0 1-1.66 0L2.6 12.5"/><path d="m22 17.5-8.58 3.91a2 2 0 0 1-1.66 0L2.6 17.5"/></svg>
        </button>
    </div>
</header>

<!-- Main Area -->
<div class="main-layout">
    <!-- Left Sidebar -->
    <div class="sidebar-left" id="sidebarLeft">
        <div class="row-group">
            <div class="section-label">Tools</div>
            <div class="tool-grid">
                <button class="tool-btn active" data-tool="pen" onclick="app.setTool('pen')" title="ペン (P)">
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                </button>
                <button class="tool-btn" data-tool="eraser" onclick="app.setTool('eraser')" title="消しゴム (E)">
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
                </button>
                <button class="tool-btn" data-tool="bucket" onclick="app.setTool('bucket')" title="塗りつぶし (F)">
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="m19 11-8-8-8.5 8.5a2.12 2.12 0 0 0 0 3l5 5c.8.8 2.2.8 3 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 2-4 2-4s2 2.4 2 4Z"/></svg>
                </button>
                <button class="tool-btn" data-tool="picker" onclick="app.setTool('picker')" title="スポイト (I)">
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="m14 2 4 4-2 2-4-4 2-2Z"/><path d="m10 6-7 7a2 2 0 0 0 0 3l2 2a2 2 0 0 0 3 0l7-7-5-5Z"/><path d="m2 22 3-1-2-2-1 3Z"/></svg>
                </button>
                <button class="tool-btn" data-tool="line" onclick="app.setTool('line')" title="直線 (L)">
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><circle cx="5" cy="19" r="1.5" fill="currentColor"/><circle cx="19" cy="5" r="1.5" fill="currentColor"/></svg>
                </button>
                <button class="tool-btn" data-tool="rect" onclick="app.setTool('rect')" title="矩形 (R)">
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                </button>
                <button class="tool-btn" data-tool="circle" onclick="app.setTool('circle')" title="円 (C)">
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
                </button>
                <button class="tool-btn" data-tool="select" onclick="app.setTool('select')" title="選択 (S)">
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M4 7V4h3"/><path d="M17 4h3v3"/><path d="M20 17v3h-3"/><path d="M7 20H4v-3"/><line x1="11" y1="4" x2="13" y2="4"/><line x1="11" y1="20" x2="13" y2="20"/><line x1="4" y1="11" x2="4" y2="13"/><line x1="20" y1="11" x2="20" y2="13"/></svg>
                </button>
                <button class="tool-btn" data-tool="pan" onclick="app.setTool('pan')" title="手のひら (H / Space)">
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v4"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 0 1 4 4 7 7 0 0 1-7 7H9a7 7 0 0 1-7-7V9a2 2 0 0 1 4 0"/></svg>
                </button>
                <button class="tool-btn" data-tool="shift" onclick="app.setTool('shift')" title="レイヤー全体移動 (M)">
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
                </button>
            </div>

            <!-- 復元: ペン太さ (1〜50px 数値入力＋スライダー＋1pxリセット) -->
            <div class="inline-row" style="margin-top:4px;">
                <span style="font-size:10px; width:28px;">太さ:</span>
                <input type="range" id="toolSize" min="1" max="50" value="1" style="flex:1;" oninput="app.syncToolSize(this.value)">
                <input type="number" id="toolSizeInput" min="1" max="50" value="1" style="width:38px; height:22px; padding:1px 2px;" onchange="app.syncToolSize(this.value)">
                <button id="btnResetSize" onclick="app.syncToolSize(1)" style="padding:2px 4px; height:22px; font-size:10px;" title="1pxに戻す">1</button>
            </div>
            
            <label class="inline-row" style="cursor:pointer; font-size:10px; margin-top:2px;">
                <input type="checkbox" id="pixelPerfect" checked>
                <span>Pixel-Perfect (余分な角の除去)</span>
            </label>
        </div>

        <div class="row-group">
            <div class="section-label">Color & Alpha</div>
            <div class="color-row">
                <div class="color-preview-wrap">
                    <input type="color" id="colorPicker" value="#000000" oninput="app.setColorFromUI()">
                    <div class="color-preview-overlay" id="colorPreviewBox"></div>
                </div>
                <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
                    <input type="range" id="alphaSlider" min="0" max="1" step="0.01" value="1" oninput="app.setColorFromUI()" title="不透明度">
                </div>
                <button onclick="app.addCurrentColor()" title="パレット追加">
                    <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
            <div id="paletteContainer"></div>
            
            <!-- 復元: 画像からパレット抽出 (上限256色) -->
            <button onclick="document.getElementById('palLoader').click()" style="margin-top:2px;">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                <span>画像からパレット抽出 (最大256色)</span>
            </button>
            <input type="file" id="palLoader" style="display:none" accept="image/*" onchange="app.loadPaletteFromImage(this)">
        </div>

        <div class="row-group" style="margin-top:auto;">
            <div class="inline-row">
                <button onclick="app.toggleFullscreenMode()" style="flex:1;" title="全画面作画">
                    <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    <span>全画面</span>
                </button>
                <button onclick="app.resetView()" title="全体中央">
                    <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Center Workspace -->
    <div class="workspace-viewport" id="viewport">
        <!-- Floating Context Bar for Selection -->
        <div class="selection-floating-bar" id="selectionToolbar">
            <button onclick="app.copySelection()" title="選択範囲をコピー (Ctrl+C)">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><rect width="13" height="13" x="9" y="9" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span>コピー</span>
            </button>
            <button onclick="app.pasteSelection()" title="新規レイヤーに貼り付け (Ctrl+V)">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1"/></svg>
                <span>貼付</span>
            </button>
            <button onclick="app.flipSelectionHorizontal()" title="左右反転">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
            </button>
            <button onclick="app.flipSelectionVertical()" title="上下反転">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3"/><path d="M3 16v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
            </button>
            <button onclick="app.clearSelectionContent()" title="消去 (Delete)" style="color:var(--danger);">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>
            </button>
            <button onclick="app.deselect()" title="解除 (Ctrl+D)">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <!-- Transform Layer -->
        <div id="canvasTransformLayer">
            <div id="canvasArtboard">
                <canvas id="drawingCanvas"></canvas>
                <canvas id="selectionOverlay"></canvas>
            </div>
        </div>

        <!-- Bottom Quick Dock -->
        <div class="floating-quick-bar">
            <span id="toolSizeLabel" style="font-size:9px; font-weight:700; color:var(--text-secondary);">太さ:</span>
            <span id="toolSizeVal" style="font-size:9px; width:16px; font-weight:600;">1</span>

            <div style="width:1px; height:12px; background:var(--border-subtle); margin:0 1px;"></div>

            <button class="quick-zoom-btn" onclick="app.setZoom(-1)" style="padding:1px 4px; height:20px; font-size:10px;">-</button>
            <span id="zoomLabel" style="font-size:9px; font-weight:600; width:30px; text-align:center;">100%</span>
            <button class="quick-zoom-btn" onclick="app.setZoom(1)" style="padding:1px 4px; height:20px; font-size:10px;">+</button>
        </div>
    </div>

    <!-- Right Sidebar -->
    <div class="sidebar-right" id="sidebarRight">
        <div class="row-group">
            <div class="section-label">Layers</div>
            <div class="inline-row">
                <button onclick="app.addLayer()" style="flex:1;" title="追加"><svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                <button onclick="app.moveLayerUp()" title="上へ"><svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg></button>
                <button onclick="app.moveLayerDown()" title="下へ"><svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
                <button onclick="app.mergeDown()" title="結合"><svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="7 10 12 15 17 10"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
                <button onclick="app.deleteLayer()" title="削除" style="color:var(--danger);"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg></button>
            </div>
            <div id="layerList" class="layer-list"></div>
        </div>

        <div class="row-group">
            <div class="section-label">File / Import</div>
            <button onclick="document.getElementById('fileLoader').click()">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
                <span>開く (画像/シート/XML/JSON)</span>
            </button>
            <button onclick="document.getElementById('layerLoader').click()">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>画像を新規レイヤー挿入</span>
            </button>
            <input type="file" id="fileLoader" multiple style="display:none" onchange="app.handleFileImport(this)">
            <input type="file" id="layerLoader" accept="image/*" style="display:none" onchange="app.handleLayerImport(this)">
            <input type="file" id="xmlLoader" accept=".xml" style="display:none" onchange="app.handleXmlImport(this)">
        </div>

        <div class="row-group">
            <div class="section-label">Settings</div>
            <button onclick="app.openResizeModal()">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
                <span>キャンバスサイズ変更</span>
            </button>
            <label class="inline-row" style="cursor:pointer; font-size:10px;">
                <input type="checkbox" id="onionSkin" onchange="app.renderCanvas()">
                <span>オニオンスキン (前コマ透かし)</span>
            </label>
            <div class="inline-row" style="margin-top:2px;">
                <button onclick="app.saveToStorage()" style="flex:1;">クイック保存</button>
                <button onclick="app.loadFromStorage()" style="flex:1;">クイック読込</button>
            </div>
        </div>

        <div class="row-group" style="margin-top:auto;">
            <button onclick="app.newProjectConfirm()" style="color:var(--danger);">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span>新規キャンバス (クリア)</span>
            </button>
        </div>
    </div>
</div>

<!-- Timeline Bottom -->
<div class="timeline-area" id="timelineArea">
    <div class="timeline-controls">
        <div class="inline-row">
            <button onclick="app.togglePlay()" id="playBtn" style="font-weight:600;">
                <svg class="icon icon-sm" id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg>
                <span id="playLabel" class="hide-on-compact hide-on-ultranarrow">再生</span>
            </button>
            <div id="fpsContainer" class="inline-row hide-on-ultranarrow" style="font-size:10px; color:var(--text-secondary);">
                <span>FPS</span>
                <input type="number" id="fps" value="12" min="1" max="60" style="width:32px; height:20px;" onchange="app.updateFps()">
            </div>
        </div>
        <div class="inline-row">
            <button class="hide-on-compact hide-on-ultranarrow" onclick="app.addFrame()" title="コマ追加"><svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
            <button class="hide-on-compact hide-on-ultranarrow" onclick="app.duplicateFrame()" title="複製"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect width="13" height="13" x="9" y="9" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
            <button class="hide-on-compact hide-on-ultranarrow" onclick="app.deleteFrame()" title="削除" style="color:var(--danger);"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg></button>
            <button id="timelineCollapseBtn" onclick="app.toggleTimeline()" title="タイムライン折りたたみ">
                <svg class="icon icon-sm" id="timelineCollapseIcon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
        </div>
    </div>
    <div class="frames-container" id="frameList"></div>
</div>

<!-- Resize & 9-Anchor Modal -->
<div class="modal-backdrop" id="resizeModal">
    <div class="modal-window">
        <div class="modal-header">
            <span class="modal-title">
                <svg class="icon" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
                <span>サイズ変更 (方向指定)</span>
            </span>
            <button onclick="document.getElementById('resizeModal').style.display='none'">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="inline-row" style="justify-content:space-between;">
                <label style="font-size:10px;">幅: <input type="number" id="resizeModalW" value="32" style="width:50px;"></label>
                <label style="font-size:10px;">高: <input type="number" id="resizeModalH" value="32" style="width:50px;"></label>
            </div>
            <div style="font-size:10px; font-weight:600; text-align:center; margin-top:4px;">基準点 (Anchor)</div>
            <div class="anchor-grid">
                <button type="button" class="anchor-btn" data-anchor="tl" onclick="app.selectAnchor('tl')">↖</button>
                <button type="button" class="anchor-btn" data-anchor="tc" onclick="app.selectAnchor('tc')">↑</button>
