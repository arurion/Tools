<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScoreFlow - Music Score PDF Converter</title>
  <link rel="stylesheet" href="./style.css" />
  <!-- OpenSheetMusicDisplay (楽譜レンダラー) -->
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.8/build/opensheetmusicdisplay.min.js"></script>
  <!-- @tonejs/midi (ブラウザ側MIDIパーサー) -->
  <script src="https://unpkg.com/@tonejs/midi"></script>
</head>
<body>
  <div class="app-root">
    <!-- OS風追従ヘッダー (ティントガラス質感 / 印刷時は非表示) -->
    <header class="app-chrome no-print">
      <div class="chrome-brand">
        <!-- 幾何学的なミニマルアイコン -->
        <svg class="brand-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span class="brand-name">ScoreFlow</span>
        <span class="format-badge">MIDI / MusicXML 4.0</span>
      </div>

      <div class="chrome-controls">
        <div class="param-unit">
          <label for="zoom-select">倍率</label>
          <select id="zoom-select">
            <option value="0.75">75%</option>
            <option value="0.85">85%</option>
            <option value="1.0" selected>100%</option>
            <option value="1.15">115%</option>
            <option value="1.3">130%</option>
          </select>
        </div>

        <div class="param-unit" id="quantize-unit">
          <label for="quantize-select">クオンタイズ</label>
          <select id="quantize-select" title="MIDI変換時の音符丸め精度">
            <option value="32">1/32</option>
            <option value="16" selected>1/16</option>
            <option value="8">1/8</option>
            <option value="4">1/4</option>
          </select>
        </div>

        <div class="action-divider"></div>

        <button id="btn-export-xml" class="action-btn secondary" disabled>
          XML保存
        </button>

        <button id="btn-print-pdf" class="action-btn primary" disabled>
          PDF出力 / 印刷
        </button>
      </div>
    </header>

    <!-- メイン作業領域 -->
    <main class="workbench">
      <!-- ドロップゾーン (非印刷) -->
      <section id="drop-zone" class="drop-surface no-print">
        <div class="drop-content">
          <!-- 控えめなドキュメントインポートSVG -->
          <svg class="upload-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="12" y2="12"></line>
            <line x1="15" y1="15" x2="12" y2="12"></line>
          </svg>
          <div class="drop-instructions">
            <p class="primary-msg">MIDI または MusicXML ファイルをドロップ</p>
            <p class="secondary-msg">対応形式: <code>.mid</code>, <code>.midi</code>, <code>.musicxml</code>, <code>.xml</code>, <code>.mxl</code> (MusicXML 4.0 対応)</p>
          </div>
          <label class="file-picker-btn">
            ファイルを選択
            <input type="file" id="file-input" accept=".mid,.midi,.musicxml,.xml,.mxl" />
          </label>
        </div>
      </section>

      <!-- 状態通知バー (非印刷) -->
      <div id="status-bar" class="status-panel no-print" aria-live="polite"></div>

      <!-- 楽譜描画コンテナ (印刷対象) -->
      <article id="score-viewport" class="score-sheet-wrapper">
        <div id="osmd-container"></div>
      </article>
    </main>
  </div>

  <script src="./js/midi2xml.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
