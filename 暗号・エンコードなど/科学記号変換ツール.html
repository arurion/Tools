<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素記号 相互変換ステーション</title>
    <style>
        :root {
            --primary-color: #3498db;
            --accent-color: #e67e22;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            border: 1px solid #dfe6e9;
        }

        /* ヘッダーとタブ */
        .header {
            background: #2c3e50;
            padding: 20px;
            text-align: center;
            color: white;
        }
        .header h1 { margin: 0; font-size: 24px; letter-spacing: 0.05em; }
        .header p { margin: 5px 0 0; color: #bdc3c7; font-size: 0.9em; }

        .tabs {
            display: flex;
            background: #ecf0f1;
            border-bottom: 1px solid #bdc3c7;
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: bold;
            color: #7f8c8d;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .tab-btn:hover { background: #dfe6e9; color: #2c3e50; }
        .tab-btn.active {
            color: var(--primary-color);
            background: white;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary-color);
        }
        /* Decoderタブのアクティブ色 */
        .tab-btn#btn-decoder.active { color: var(--accent-color); }
        .tab-btn#btn-decoder.active::after { background: var(--accent-color); }

        /* コンテンツエリア */
        .content-area {
            padding: 30px 20px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .content-area.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* -------------------------
           Converter Styles
           ------------------------- */
        .controls {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid #eee;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.9em;
            user-select: none;
        }
        .checkbox-wrapper input { margin-right: 8px; accent-color: var(--primary-color); transform: scale(1.1); }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 5px;
            color: white;
        }
        .bg-org { background-color: #e67e22; }
        .bg-chem { background-color: #9b59b6; }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex-grow: 1;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: var(--primary-color); }
        
        .btn-convert {
            padding: 0 30px;
            font-size: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-convert:hover { background-color: #2980b9; }

        .result-row { margin-bottom: 25px; }
        .label {
            display: block;
            font-size: 0.75em;
            color: #95a5a6;
            font-weight: 800;
            letter-spacing: 0.05em;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .value {
            font-size: 1.3em;
            color: #2c3e50;
            font-weight: 500;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #ddd;
        }
        .element-card {
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            padding: 8px 10px;
            text-align: center;
            background: white;
            min-width: 55px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .element-card.std { border-bottom: 3px solid var(--primary-color); }
        .element-card.org { border-bottom: 3px solid #e67e22; background: #fffbf7; }
        .element-card.chem { border-bottom: 3px solid #9b59b6; background: #fbf7ff; }
        .element-card.error { border-bottom: 3px solid #e74c3c; background: #fff5f5; }

        .ec-sym { display: block; font-size: 1.6em; font-weight: bold; color: #2c3e50; }
        .ec-jp { display: block; font-size: 0.7em; color: #555; }
        .ec-num { display: block; font-size: 0.6em; color: #aaa; text-align: left; }

        /* -------------------------
           Decoder Styles
           ------------------------- */
        .decoder-area textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
        }
        .decoder-area textarea:focus { border-color: var(--accent-color); }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 20px; }
        .btn-decode {
            flex-grow: 1;
            padding: 12px;
            font-size: 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-decode:hover { background-color: #d35400; }
        .btn-clear {
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 20px;
            cursor: pointer;
        }

        .decoded-result {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .decoded-text {
            font-size: 2.2em;
            font-weight: bold;
            color: var(--accent-color);
            word-break: break-all;
            margin-bottom: 15px;
            line-height: 1.2;
        }
        .decoded-detail {
            font-size: 0.85em;
            color: #bdc3c7;
            text-align: left;
            border-top: 1px solid #465f76;
            padding-top: 10px;
        }
        .token {
            display: inline-block;
            margin: 2px;
            padding: 2px 6px;
            background: #34495e;
            border-radius: 4px;
            border: 1px solid #465f76;
        }
        
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ELEMENT STATION</h1>
        <p>元素記号 変換・復元統合ツール</p>
    </div>

    <!-- タブ切り替え -->
    <div class="tabs">
        <button class="tab-btn active" id="btn-converter" onclick="switchTab('converter')">CONVERTER (英→元素)</button>
        <button class="tab-btn" id="btn-decoder" onclick="switchTab('decoder')">DECODER (和→英)</button>
    </div>

    <!-- 1. CONVERTER 画面 -->
    <div id="view-converter" class="content-area active">
        <div class="controls">
            <label class="checkbox-wrapper">
                <input type="checkbox" id="chkOrganic" checked onchange="runConversion()">
                <span>有機化学略号 <span class="badge bg-org">Me, Ph</span></span>
            </label>
            <label class="checkbox-wrapper">
                <input type="checkbox" id="chkChemistry" checked onchange="runConversion()">
                <span>化学用語・穴埋め <span class="badge bg-chem">A, Z, Q</span></span>
            </label>
        </div>

        <div class="input-group">
            <input type="text" id="inputConv" placeholder="変換したい英単語 (例: Galaxy, Phone)" onkeydown="if(event.key==='Enter') runConversion()">
            <button class="btn-convert" onclick="runConversion()">変換</button>
        </div>

        <div id="outConv" style="display:none;">
            <div class="result-row">
                <span class="label">1. English</span>
                <div class="value" id="resEnglish"></div>
            </div>
            <div class="result-row">
                <span class="label">2. 日本語</span>
                <div class="value" id="resJapanese"></div>
            </div>
            <div class="result-row">
                <span class="label">3. Symbol</span>
                <div class="value" id="resSymbol" style="font-family: monospace; font-size: 1.5em; letter-spacing: 0.1em;"></div>
            </div>
            <div class="cards-area" id="convCards"></div>
        </div>
    </div>

    <!-- 2. DECODER 画面 -->
    <div id="view-decoder" class="content-area decoder-area">
        <p style="margin-top:0; color:#666; font-size:0.9em;">
            「硫黄ウラシル...」のような元素名の羅列を、元のアルファベットに復元します。
        </p>
        <textarea id="inputDec" placeholder="ここにメッセージを貼り付け (例: 硫黄ウラシルグアニン酸素インジウムグアニン酸素ネオン)"></textarea>
        
        <div class="btn-group">
            <button class="btn-clear" onclick="clearDecoder()">クリア</button>
            <button class="btn-decode" onclick="runDecode()">復元する</button>
        </div>

        <div id="outDec" style="display:none;" class="decoded-result">
            <div class="decoded-text" id="resDecoded"></div>
            <div class="decoded-detail" id="resDetail"></div>
        </div>
    </div>
</div>

// =========================================================
//  LOGIC: CONVERTER (英→元素)
// =========================================================
function runConversion() {
    const rawInput = document.getElementById('inputConv').value;
    const outputArea = document.getElementById('outConv');
    
    if (!rawInput) {
        outputArea.style.display = 'none';
        return;
    }

    const useOrg = document.getElementById('chkOrganic').checked;
    const useChem = document.getElementById('chkChemistry').checked;

    // 探索用DBの構築 (lowercase key -> data object)
    let searchDB = {};
    
    // 優先度順に登録 (上書きを防ぐため、存在チェックを入れる)
    // 優先度: Standard > Organic > Chemistry (ただし2文字マッチが優先されるロジックなので、AcなどはStdが勝つ)
    
    masterDB.forEach(item => {
        const k = item.s.toLowerCase();
        
        // 追加条件
        let shouldAdd = false;
        if (item.t === 'std') shouldAdd = true;
        else if (item.t === 'org' && useOrg) shouldAdd = true;
        else if (item.t === 'chem' && useChem) shouldAdd = true;

        if (shouldAdd) {
            // キーがまだない場合、登録。
            // 重複キー(Ac, Tなど)がある場合、基本はStd優先。
            // しかし、Ac(Acetyl)を有効にしたい場合もあるが、Actiniumと同じSymbolなので
            // 変換結果としてはどちらが出ても「Ac」になる。
            // 日本語表記を変えたい場合はここで制御が必要だが、今回は最初に見つかったものを採用(Std優先)
            if (!searchDB[k]) {
                searchDB[k] = item;
            }
        }
    });

    const resultPath = solvePuzzle(rawInput, searchDB);
    displayConvResult(resultPath);
}

function solvePuzzle(text, db) {
    const cleanText = text.replace(/\s+/g, '');
    const len = cleanText.length;
    const memo = new Array(len + 1).fill(undefined);

    function search(idx) {
        if (idx === len) return [];
        if (memo[idx] !== undefined) return memo[idx];

        let candidates = [];
        // 2 chars
        if (idx + 1 < len) {
            const s2 = cleanText.substr(idx, 2).toLowerCase();
            if (db[s2]) candidates.push({ len: 2, data: db[s2] });
        }
        // 1 char
        const s1 = cleanText.substr(idx, 1).toLowerCase();
        if (db[s1]) candidates.push({ len: 1, data: db[s1] });

        for (let cand of candidates) {
            const res = search(idx + cand.len);
            if (res !== null) {
                const path = [cand].concat(res);
                memo[idx] = path;
                return path;
            }
        }
        memo[idx] = null;
        return null;
    }

    const fullMatch = search(0);
    if (fullMatch) return fullMatch.map(i => ({ found: true, data: i.data }));

    // Fallback
    return greedyFallback(cleanText, db);
}

function greedyFallback(text, db) {
    let i = 0;
    const res = [];
    while (i < text.length) {
        if (i + 1 < text.length) {
            const s2 = text.substr(i, 2).toLowerCase();
            if (db[s2]) {
                res.push({ found: true, data: db[s2] });
                i += 2;
                continue;
            }
        }
        const s1 = text.substr(i, 1).toLowerCase();
        if (db[s1]) {
            res.push({ found: true, data: db[s1] });
            i += 1;
            continue;
        }
        res.push({ found: false, text: text[i] });
        i++;
    }
    return res;
}

function displayConvResult(path) {
    const out = document.getElementById('outConv');
    out.style.display = 'block';

    const engArr = [], jpArr = [], symArr = [];
    const cardArea = document.getElementById('convCards');
    cardArea.innerHTML = "";

    path.forEach(p => {
        const div = document.createElement('div');
        if (p.found) {
            const d = p.data;
            engArr.push(d.e);
            jpArr.push(d.j);
            symArr.push(d.s);
            
            div.className = `element-card ${d.t}`;
            div.innerHTML = `<span class="ec-num">${d.n}</span><span class="ec-sym">${d.s}</span><span class="ec-jp">${d.j}</span>`;
        } else {
            engArr.push(p.text);
            jpArr.push(p.text);
            symArr.push(p.text);
            
            div.className = `element-card error`;
            div.innerHTML = `<span class="ec-num">?</span><span class="ec-sym">${p.text}</span><span class="ec-jp"></span>`;
        }
        cardArea.appendChild(div);
    });

    document.getElementById('resEnglish').textContent = engArr.join(" ");
    document.getElementById('resJapanese').textContent = jpArr.join("");
    document.getElementById('resSymbol').textContent = symArr.join(" ");
}

// =========================================================
//  LOGIC: DECODER (和→英)
// =========================================================
function runDecode() {
    const rawInput = document.getElementById('inputDec').value;
    const out = document.getElementById('outDec');
    if (!rawInput) {
        out.style.display = 'none';
        return;
    }

    // 逆引き用マップ作成 (毎回作成するのは非効率だが、データ量は少ないのでOK)
    // 日本語名 -> Symbol
    let revMap = {};
    masterDB.forEach(d => {
        // キー重複（ウランとウラシル）はキー文字列が違うので問題なし
        // 同一日本語名がある場合（TとD両方「三重水素」など）は後勝ちになるが、
        // 復元したいのはSymbolなので、Symbolが同じなら問題ない。
        revMap[d.j] = d.s;
    });

    // キーを長さ順（降順）にソート
    const keys = Object.keys(revMap).sort((a, b) => b.length - a.length);

    // テキスト正規化
    const text = rawInput.replace(/\s+/g, '');
    let i = 0;
    const tokens = [];

    while (i < text.length) {
        let matched = false;
        for (let k of keys) {
            if (text.startsWith(k, i)) {
                tokens.push({ found: true, s: revMap[k], j: k });
                i += k.length;
                matched = true;
                break;
            }
        }
        if (!matched) {
            tokens.push({ found: false, s: text[i], j: "不明" });
            i++;
        }
    }

    out.style.display = 'block';
    
    // 結果表示
    document.getElementById('resDecoded').textContent = tokens.map(t => t.s).join("");
    
    const detailDiv = document.getElementById('resDetail');
    detailDiv.innerHTML = tokens.map(t => {
        if (t.found) return `<span class="token">${t.s} (${t.j})</span>`;
        return `<span class="token" style="background:#c0392b;">${t.s}</span>`;
    }).join("");
}

function clearDecoder() {
    document.getElementById('inputDec').value = "";
    document.getElementById('outDec').style.display = 'none';
}
